name: Mozart ML Categorical Composition Sparse Coverage

on:
  push:
    branches:
      - "feature/categorical-composition-sparse-coverage"
    paths:
      - ".github/workflows/ml-categorical-composition-sparse-coverage.yml"
      - "tools/build_categorical_composition_fixture.py"
      - "tools/evaluate_mozart_categorical_composition.py"
      - "tests/test_build_categorical_composition_fixture.py"
      - "tests/test_evaluate_mozart_categorical_composition.py"
      - "tools/mozart_model.py"
      - "tools/mozart_conditioning.py"
      - "tools/mozart_token_grammar.py"
      - "tools/midi_to_training_example.py"
      - "tools/build_fixture_corpus.py"
      - "tools/export_mozart_onnx.py"
      - "tools/train_mozart_model.py"
      - "docs/model-training-config.json"
      - "tools/requirements-onnx-export.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Test fixture and evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_categorical_composition_fixture.py'
          python3 -m unittest discover -s tests -p 'test_evaluate_mozart_categorical_composition.py'
          python3 -m py_compile tools/build_categorical_composition_fixture.py tools/evaluate_mozart_categorical_composition.py

      - name: Build sparse coverage fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ml-categorical-composition-fixture build/ml-categorical-composition-checkpoint
          python3 tools/build_categorical_composition_fixture.py             build/ml-categorical-composition-fixture             --training-profile sparse-multi-axis

      - name: Train sparse coverage checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/train_mozart_model.py             build/ml-categorical-composition-fixture/train.jsonl             --validation-jsonl build/ml-categorical-composition-fixture/validation.jsonl             --output-dir build/ml-categorical-composition-checkpoint             --epochs 12             --batch-size 4             --repeat-train-records 5             --learning-rate 3e-4             --fit-diagnostic             --seed 42             --device cpu

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path
          import torch

          fixture = json.loads(
              Path("build/ml-categorical-composition-fixture/fixture-metadata.json")
              .read_text(encoding="utf-8")
          )
          if fixture.get("training_regime") != "sparse-multi-axis":
              raise SystemExit("expected sparse-multi-axis training regime")
          if fixture.get("split_counts") != {
              "train": 32,
              "validation": 10,
              "test": 20,
          }:
              raise SystemExit("unexpected sparse fixture split counts")

          latest = torch.load(
              "build/ml-categorical-composition-checkpoint/latest.pt",
              map_location="cpu",
              weights_only=False,
          )
          best = torch.load(
              "build/ml-categorical-composition-checkpoint/best.pt",
              map_location="cpu",
              weights_only=False,
          )
          if latest.get("total_optimizer_updates") != 480:
              raise SystemExit("sparse coverage fit must contain exactly 480 optimizer updates")
          if latest.get("epoch") != 12:
              raise SystemExit("sparse coverage fit must reach epoch 12")
          if latest.get("fit_diagnostic") is not True:
              raise SystemExit("sparse coverage fit must use fit-diagnostic mode")
          if latest.get("repeat_train_records") != 5:
              raise SystemExit("sparse coverage fit must use repeat=5")
          for name, checkpoint in (("latest", latest), ("best", best)):
              for field in ("train_loss", "validation_loss"):
                  value = checkpoint.get(field)
                  if not isinstance(value, (int, float)) or not math.isfinite(value):
                      raise SystemExit(f"{name} {field} must be finite")

          print(
              "SELECTED sparse coverage checkpoint "
              f"epoch={best['epoch']} validation_loss={best['validation_loss']:.6f}"
          )
          Path("build/ml-categorical-composition-checkpoint/run-metadata.json").write_text(
              json.dumps(
                  {
                      "experiment": "categorical-composition-sparse-coverage",
                      "fixture_revision": fixture["fixture_revision"],
                      "training_regime": fixture["training_regime"],
                      "seed": int(latest["seed"]),
                      "selected_epoch": int(best["epoch"]),
                      "selected_validation_loss": float(best["validation_loss"]),
                      "total_optimizer_updates": int(latest["total_optimizer_updates"]),
                      "repeat_train_records": int(latest["repeat_train_records"]),
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          torch.save(
              {
                  "model_id": best["model_id"],
                  "config": best["config"],
                  "epoch": best["epoch"],
                  "seed": best["seed"],
                  "train_loss": best["train_loss"],
                  "validation_loss": best["validation_loss"],
                  "model_state": best["model_state"],
              },
              "build/ml-categorical-composition-checkpoint/development-inference.pt",
          )
          PY

      - name: Export sparse coverage ONNX model
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/export_mozart_onnx.py             build/ml-categorical-composition-checkpoint/development-inference.pt             build/ml-categorical-composition-checkpoint/model.onnx             --config docs/model-training-config.json             --sequence-length 64             --opset 18

      - name: Evaluate sparse coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_categorical_composition.py             build/ml-categorical-composition-checkpoint/development-inference.pt             build/ml-categorical-composition-fixture/test.jsonl             build/ml-categorical-composition-fixture/composition-probes.json             --config docs/model-training-config.json             --onnx build/ml-categorical-composition-checkpoint/model.onnx             --window-size 8             --max-generated-tokens 32             --output build/ml-categorical-composition-checkpoint/categorical-composition-report.json

      - name: Remove large optimizer checkpoints
        shell: bash
        run: |
          set -euo pipefail
          rm -f             build/ml-categorical-composition-checkpoint/latest.pt             build/ml-categorical-composition-checkpoint/best.pt             build/ml-categorical-composition-checkpoint/development-inference.pt             build/ml-categorical-composition-checkpoint/model.onnx

      - name: Publish sparse coverage artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-categorical-composition-sparse-coverage
          path: |
            build/ml-categorical-composition-checkpoint/categorical-composition-report.json
            build/ml-categorical-composition-checkpoint/run-metadata.json
            build/ml-categorical-composition-fixture/records.jsonl
            build/ml-categorical-composition-fixture/train.jsonl
            build/ml-categorical-composition-fixture/validation.jsonl
            build/ml-categorical-composition-fixture/test.jsonl
            build/ml-categorical-composition-fixture/composition-probes.json
            build/ml-categorical-composition-fixture/fixture-metadata.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: false
