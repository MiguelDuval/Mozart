          set +e
          python3 tools/evaluate_mozart_conditioning_teacher_forced.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            build/ml-diverse-conditioning-fixture/train.jsonl \
            build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --config docs/model-training-config.json \
            --onnx build/ml-diverse-checkpoint/model.onnx \
            --window-size 8 \
            --output build/ml-diverse-checkpoint/conditioning-teacher-forced.json
          diverse_teacher_status=$?

          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-diverse-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --grammar-constrained \
            --no-require-divergence \
            --require-valid-grammar \
            --require-distribution-response \
            --min-distribution-total-variation 0.05 \
            --seed 42 \
            --output build/ml-diverse-checkpoint/conditioning-sequence-grammar-constrained.json
          diverse_sequence_status=$?
          set -e
          echo "context-diverse diagnostics: teacher_forced_status=$diverse_teacher_status sequence_status=$diverse_sequence_status"
      - name: Summarize context-diversity experiment
        if: ${{ always() && inputs.run_diversity_experiment }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              candidate = Path(path)
              if not candidate.exists():
                  return None
              return json.loads(candidate.read_text(encoding="utf-8"))

          baseline_teacher = load("build/ml-checkpoint/conditioning-teacher-forced.json")
          matched_teacher = load("build/ml-matched-checkpoint/conditioning-teacher-forced.json")
          diverse_teacher = load("build/ml-diverse-checkpoint/conditioning-teacher-forced.json")
          baseline_sequence = load(
              "build/ml-checkpoint/conditioning-sequence-grammar-constrained.json"
          )
          matched_sequence = load(
              "build/ml-matched-checkpoint/conditioning-sequence-grammar-constrained.json"
          )
          diverse_sequence = load(
              "build/ml-diverse-checkpoint/conditioning-sequence-grammar-constrained.json"
          )

          def summarize_teacher(report):
              if report is None:
                  return None
              keys = (
                  "status",
                  "train_loss",
                  "validation_loss",
                  "observed_teacher_forced_steps",
                  "native_target_top1_steps",
                  "native_legal_target_top1_steps",
                  "controls_with_both_legal_targets_top1",
                  "controls_with_bidirectional_target_response",
                  "target_probability_directional_response_rate",
                  "target_family_probability_directional_response_rate",
                  "mean_target_probability_delta_native_minus_counterfactual",
                  "mean_target_family_probability_delta_native_minus_counterfactual",
                  "mean_target_probability_tv_alignment",
                  "mean_distribution_total_variation_native_vs_counterfactual",
              )
              return {key: report.get(key) for key in keys}

          def summarize_sequence(report):
              if report is None:
                  return None
              controls = report.get("controls") or {}
              sequence_changed = 0
              max_tvs = []
              for entry in controls.values():
                  torch_report = entry.get("torch") or {}
                  if torch_report.get("sequence_changed") is True:
                      sequence_changed += 1
                  response = torch_report.get("distribution_response") or {}
                  value = response.get("max_total_variation")
                  if isinstance(value, (int, float)):
                      max_tvs.append(float(value))
              keys = (
                  "status",
                  "grammar_constrained",
                  "require_valid_grammar",
                  "require_distribution_response",
                  "min_distribution_total_variation",
                  "max_generated_tokens",
                  "failures",
              )
              summary = {key: report.get(key) for key in keys}
              summary["controls_with_sequence_change"] = sequence_changed
              summary["mean_control_max_total_variation"] = (
                  sum(max_tvs) / len(max_tvs) if max_tvs else None
              )
              summary["min_control_max_total_variation"] = (
                  min(max_tvs) if max_tvs else None
              )
              summary["max_control_max_total_variation"] = (
                  max(max_tvs) if max_tvs else None
              )
              return summary

          def subtract(left, right):
              if left is None or right is None:
                  return None
              return float(left) - float(right)

          def compare_experiments(matched, diverse):
              if matched is None or diverse is None:
                  return None
              matched_controls = matched.get("controls") or {}
              diverse_controls = diverse.get("controls") or {}
              comparison = {}
              for name in sorted(set(matched_controls) & set(diverse_controls)):
                  matched_entry = matched_controls[name]
                  diverse_entry = diverse_controls[name]
                  mt = matched_entry.get("torch") or {}
                  dt = diverse_entry.get("torch") or {}
                  mdr = mt.get("distribution_response") or {}
                  ddr = dt.get("distribution_response") or {}
                  comparison[name] = {
                      "sequence_changed_delta": (
                          int(bool(dt.get("sequence_changed")))
                          - int(bool(mt.get("sequence_changed")))
                      ),
                      "max_total_variation_delta": subtract(
                          ddr.get("max_total_variation"),
                          mdr.get("max_total_variation"),
                      ),
                      "mean_total_variation_delta": subtract(
                          ddr.get("mean_total_variation"),
                          mdr.get("mean_total_variation"),
                      ),
                  }
              return comparison

                    reports = (
              baseline_teacher,
              matched_teacher,
              diverse_teacher,
              baseline_sequence,
              matched_sequence,
              diverse_sequence,
          )
          available_statuses = [
              report.get("status")
              for report in reports
              if report is not None
          ]
          matched_diverse_reports = (
              matched_teacher,
              matched_sequence,
              diverse_teacher,
              diverse_sequence,
          )

          if not available_statuses:
              experiment_status = "NO_REPORTS"
          elif any(status != "PASS" for status in available_statuses):
              experiment_status = "FAIL"
          elif any(report is None for report in matched_diverse_reports):
              experiment_status = "PARTIAL"
          else:
              experiment_status = "PASS"

          matched_teacher_summary = summarize_teacher(matched_teacher)
          diverse_teacher_summary = summarize_teacher(diverse_teacher)
          matched_sequence_summary = summarize_sequence(matched_sequence)
          diverse_sequence_summary = summarize_sequence(diverse_sequence)

          teacher_delta = None
          if matched_teacher_summary is not None and diverse_teacher_summary is not None:
              teacher_delta = {
                  "train_loss_delta": subtract(
                      diverse_teacher_summary.get("train_loss"),
                      matched_teacher_summary.get("train_loss"),
                  ),
                  "validation_loss_delta": subtract(
                      diverse_teacher_summary.get("validation_loss"),
                      matched_teacher_summary.get("validation_loss"),
                  ),
                  "target_probability_directional_response_rate_delta": subtract(
                      diverse_teacher_summary.get("target_probability_directional_response_rate"),
                      matched_teacher_summary.get("target_probability_directional_response_rate"),
                  ),
                  "target_family_probability_directional_response_rate_delta": subtract(
                      diverse_teacher_summary.get("target_family_probability_directional_response_rate"),
                      matched_teacher_summary.get("target_family_probability_directional_response_rate"),
                  ),
                  "mean_target_probability_delta_delta": subtract(
                      diverse_teacher_summary.get("mean_target_probability_delta_native_minus_counterfactual"),
                      matched_teacher_summary.get("mean_target_probability_delta_native_minus_counterfactual"),
                  ),
                  "mean_target_family_probability_delta_delta": subtract(
                      diverse_teacher_summary.get("mean_target_family_probability_delta_native_minus_counterfactual"),
                      matched_teacher_summary.get("mean_target_family_probability_delta_native_minus_counterfactual"),
                  ),
                  "mean_distribution_total_variation_delta": subtract(
                      diverse_teacher_summary.get("mean_distribution_total_variation_native_vs_counterfactual"),
                      matched_teacher_summary.get("mean_distribution_total_variation_native_vs_counterfactual"),
                  ),
              }

          sequence_delta = None
          if matched_sequence_summary is not None and diverse_sequence_summary is not None:
              sequence_delta = {
                  "controls_with_sequence_change_delta": (
                      int(diverse_sequence_summary.get("controls_with_sequence_change") or 0)
                      - int(matched_sequence_summary.get("controls_with_sequence_change") or 0)
                  ),
                  "mean_control_max_total_variation_delta": subtract(
                      diverse_sequence_summary.get("mean_control_max_total_variation"),
                      matched_sequence_summary.get("mean_control_max_total_variation"),
                  ),
                  "min_control_max_total_variation_delta": subtract(
                      diverse_sequence_summary.get("min_control_max_total_variation"),
                      matched_sequence_summary.get("min_control_max_total_variation"),
                  ),
                  "max_control_max_total_variation_delta": subtract(
                      diverse_sequence_summary.get("max_control_max_total_variation"),
                      matched_sequence_summary.get("max_control_max_total_variation"),
                  ),
              }
          summary = {
              "status": experiment_status,
              "baseline_regular": {
                  "teacher_forced": summarize_teacher(baseline_teacher),
                  "grammar_constrained_sequence": summarize_sequence(baseline_sequence),
              },
              "baseline_matched_exposure": {
                  "teacher_forced": matched_teacher_summary,
                  "grammar_constrained_sequence": matched_sequence_summary,
              },
              "context_diverse": {
                  "teacher_forced": diverse_teacher_summary,
                  "grammar_constrained_sequence": diverse_sequence_summary,
              },
              "diverse_minus_matched": {
                  "teacher_forced": teacher_delta,
                  "grammar_constrained_sequence": sequence_delta,
                  "per_control_autoregressive": compare_experiments(
                      matched_sequence, diverse_sequence
                  ),
              },
          }
          Path("build/ml-context-diversity-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload development ML artifacts
        if: ${{ always() && hashFiles('build/ml-checkpoint/development-inference.pt', 'build/ml-checkpoint/model.onnx', 'build/ml-checkpoint/abi.json', 'build/ml-checkpoint/conditioning-response.json', 'build/ml-checkpoint/conditioning-sequence-response.json', 'build/ml-checkpoint/conditioning-sequence-grammar-constrained.json', 'build/ml-checkpoint/conditioning-teacher-forced.json', 'build/ml-conditioning-fixture/sequence-probes.json') != '' }}
        uses: actions/upload-artifact@v7
