name: Mozart ML Model

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".github/workflows/ml-model.yml"

      - "tools/build_fixture_corpus.py"
      - "tools/train_mozart_model.py"
      - "tools/export_mozart_onnx.py"
      - "tools/inspect_mozart_onnx.py"
      - "tools/mozart_model.py"
      - "tools/midi_to_training_example.py"
      - "tools/build_training_windows.py"
      - "tools/mozart_conditioning.py"
      - "tools/mozart_token_grammar.py"
      - "tests/test_midi_to_training_example.py"
      - "tests/test_build_training_windows.py"
      - "docs/model-training-config.json"
      - "docs/model-manifest.example.json"
      - "docs/experimental-onnx-manifest.example.json"
      - "tests/test_build_fixture_corpus.py"
      - "tests/test_corpus_pipeline.py"
      - "tests/test_mozart_model_config.py"
      - "tests/test_mozart_conditioning_response.py"
      - "tests/test_mozart_token_grammar.py"
      - "tests/test_mozart_conditioning_sequence_response.py"
      - "tests/test_build_conditioning_fixture_corpus.py"
      - "tests/test_train_mozart_model.py"
      - "tests/test_mozart_conditioning_teacher_forced.py"
      - "tools/evaluate_mozart_conditioning_teacher_forced.py"
      - "tools/evaluate_mozart_conditioning.py"
      - "tools/evaluate_mozart_conditioning_sequence.py"
      - "tools/build_conditioning_fixture_corpus.py"
      - "docs/MODEL-TRAINING-BASELINE.md"
      - "tools/requirements-onnx-export.txt"
  pull_request:
    paths:
      - "tools/build_fixture_corpus.py"
      - "tools/train_mozart_model.py"
      - "tools/export_mozart_onnx.py"
      - "tools/inspect_mozart_onnx.py"
      - "tools/mozart_model.py"
      - "tools/midi_to_training_example.py"
      - "tools/build_training_windows.py"
      - "tools/mozart_conditioning.py"
      - "tools/mozart_token_grammar.py"
      - "tests/test_midi_to_training_example.py"
      - "tests/test_build_training_windows.py"
      - "docs/model-training-config.json"
      - "docs/model-manifest.example.json"
      - "docs/experimental-onnx-manifest.example.json"
      - "tests/test_build_fixture_corpus.py"
      - "tests/test_corpus_pipeline.py"
      - "tests/test_mozart_model_config.py"
      - "tests/test_mozart_conditioning_response.py"
      - "tests/test_mozart_token_grammar.py"
      - "tests/test_mozart_conditioning_sequence_response.py"
      - "tests/test_build_conditioning_fixture_corpus.py"
      - "tests/test_train_mozart_model.py"
      - "tests/test_mozart_conditioning_teacher_forced.py"
      - "tools/evaluate_mozart_conditioning_teacher_forced.py"
      - "tools/evaluate_mozart_conditioning.py"
      - "tools/evaluate_mozart_conditioning_sequence.py"
      - "tools/build_conditioning_fixture_corpus.py"
      - "docs/MODEL-TRAINING-BASELINE.md"
      - "tools/requirements-onnx-export.txt"
  workflow_dispatch:
    inputs:
      run_diversity_experiment:
        description: "Run the 22-record context-diversity fit diagnostic"
        required: false
        default: false
        type: boolean

concurrency:
  group: mozart-ml-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Validate model manifest templates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_model_manifest.py docs/model-manifest.example.json
          python3 tools/validate_model_manifest.py docs/experimental-onnx-manifest.example.json

      - name: Test model manifest validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_model_manifest.py'

      - name: Test compact model configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_model_config.py'

      - name: Test deterministic synthetic fixture corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_fixture_corpus.py'

      - name: Test end-to-end corpus pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_corpus_pipeline.py'

      - name: Compile model training scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/mozart_model.py \
            tools/train_mozart_model.py \
            tools/export_mozart_onnx.py \
            tools/inspect_mozart_onnx.py \
            tools/evaluate_mozart_conditioning.py \
            tools/evaluate_mozart_conditioning_sequence.py \
            tools/evaluate_mozart_conditioning_teacher_forced.py \
            tools/build_conditioning_fixture_corpus.py \
            tools/mozart_conditioning.py \
            tools/midi_to_training_example.py \
            tools/build_training_windows.py \
            tools/build_training_shards.py \
            tools/build_fixture_corpus.py

      - name: Test shared Mozart token grammar contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_token_grammar.py'

      - name: Test teacher-forced conditioning evaluator contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_conditioning_teacher_forced.py'

      - name: Test development trainer repetition contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_train_mozart_model.py'


      - name: Test conditioning response evaluator contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_conditioning_response.py'

      - name: Test greedy conditioning sequence evaluator contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_conditioning_sequence_response.py'

      - name: Test control-driven conditioning fixture corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_conditioning_fixture_corpus.py'

      - name: Train development checkpoint and export ONNX ABI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ml-fixture build/ml-conditioning-fixture build/ml-checkpoint
          python3 tools/build_fixture_corpus.py build/ml-fixture
          python3 tools/build_conditioning_fixture_corpus.py build/ml-conditioning-fixture

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/ml-conditioning-fixture")
          records = [
              json.loads(line)
              for line in (root / "records.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for split in ("train", "validation"):
              selected = [record for record in records if record["split"] == split]
              if not selected:
                  raise SystemExit(f"missing {split} records")
              (root / f"{split}.jsonl").write_text(
                  "".join(json.dumps(record, sort_keys=True) + "\n" for record in selected),
                  encoding="utf-8",
              )
          PY

          python3 tools/train_mozart_model.py \
            build/ml-conditioning-fixture/train.jsonl \
            --validation-jsonl build/ml-conditioning-fixture/validation.jsonl \
            --output-dir build/ml-checkpoint \
            --epochs 12 \
            --batch-size 4 \
            --repeat-train-records 16 \
            --learning-rate 3e-4 \
            --fit-diagnostic \
            --seed 42 \
            --device cpu

          python3 - <<'PY'
          import math
          import torch
          from pathlib import Path

          source = Path("build/ml-checkpoint/latest.pt")
          checkpoint = torch.load(source, map_location="cpu", weights_only=False)
          epoch = checkpoint.get("epoch")
          if epoch != 12:
              raise SystemExit(
                  "development fit checkpoint must be the final requested epoch; "
                  f"got epoch={epoch!r}"
              )
          if not checkpoint.get("model_state"):
              raise SystemExit("development checkpoint has no model_state")
          if checkpoint.get("fit_diagnostic") is not True:
              raise SystemExit("development checkpoint was not trained in fit-diagnostic mode")
          if checkpoint.get("repeat_train_records") != 16:
              raise SystemExit(
                  "development fit checkpoint has unexpected repeated-record budget: "
                  f"{checkpoint.get('repeat_train_records')!r}"
              )
          if checkpoint.get("weight_decay") != 0.0:
              raise SystemExit(
                  "fit-diagnostic checkpoint must have weight_decay=0"
              )
          if checkpoint.get("total_optimizer_updates") != 480:
              raise SystemExit(
                  "development fit checkpoint must contain exactly 480 optimizer updates; "
                  f"got {checkpoint.get('total_optimizer_updates')!r}"
              )
          loss = checkpoint.get("train_loss")
          if not isinstance(loss, (int, float)) or not math.isfinite(loss):
              raise SystemExit(f"invalid training loss: {loss!r}")

          inference_checkpoint = {
              "model_id": checkpoint["model_id"],
              "config": checkpoint["config"],
              "epoch": checkpoint["epoch"],
              "seed": checkpoint["seed"],
              "train_loss": checkpoint["train_loss"],
              "validation_loss": checkpoint["validation_loss"],
              "model_state": checkpoint["model_state"],
          }
          torch.save(
              inference_checkpoint,
              "build/ml-checkpoint/development-inference.pt",
          )
          print(
              "PASS: final development fit checkpoint "
              f"epoch={checkpoint['epoch']} train_loss={checkpoint['train_loss']:.6f} "
              f"validation_loss={checkpoint['validation_loss']:.6f}"
          )
          PY

          python3 tools/export_mozart_onnx.py \
            build/ml-checkpoint/development-inference.pt \
            build/ml-checkpoint/model.onnx \
            --config docs/model-training-config.json \
            --sequence-length 16 \
            --opset 18

          python3 tools/inspect_mozart_onnx.py \
            build/ml-checkpoint/model.onnx \
            --config docs/model-training-config.json \
            > build/ml-checkpoint/abi.json
          cat build/ml-checkpoint/abi.json

      - name: Evaluate development conditioning responsiveness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_conditioning.py \
            build/ml-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-checkpoint/model.onnx \
            --output build/ml-checkpoint/conditioning-response.json

      - name: Evaluate development greedy conditioning responsiveness
        id: greedy-evaluation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-conditioning-fixture/sequence-probes.json \
            --require-valid-grammar \
            --seed 42 \
            --output build/ml-checkpoint/conditioning-sequence-response.json

      - name: Evaluate teacher-forced conditioning targets
        id: teacher-forced-evaluation
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_conditioning_teacher_forced.py \
            build/ml-checkpoint/development-inference.pt \
            build/ml-conditioning-fixture/train.jsonl \
            build/ml-conditioning-fixture/sequence-probes.json \
            --config docs/model-training-config.json \
            --onnx build/ml-checkpoint/model.onnx \
            --window-size 8 \
            --output build/ml-checkpoint/conditioning-teacher-forced.json

      - name: Evaluate grammar-constrained conditioning responsiveness
        id: grammar-constrained-evaluation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-conditioning-fixture/sequence-probes.json \
            --grammar-constrained \
            --no-require-divergence \
            --require-valid-grammar \
            --require-distribution-response \
            --min-distribution-total-variation 0.05 \
            --seed 42 \
            --output build/ml-checkpoint/conditioning-sequence-grammar-constrained.json

      - name: Train grammar-aware development checkpoint
        id: grammar-aware-training
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ml-grammar-checkpoint
          python3 tools/train_mozart_model.py \
            build/ml-conditioning-fixture/train.jsonl \
            --validation-jsonl build/ml-conditioning-fixture/validation.jsonl \
            --output-dir build/ml-grammar-checkpoint \
            --epochs 12 \
            --batch-size 4 \
            --repeat-train-records 16 \
            --learning-rate 3e-4 \
            --fit-diagnostic \
            --grammar-constrained-loss \
            --seed 42 \
            --device cpu

          python3 - <<'PY'
          import torch
          from pathlib import Path

          source = Path("build/ml-grammar-checkpoint/latest.pt")
          checkpoint = torch.load(source, map_location="cpu", weights_only=False)
          if checkpoint.get("epoch") != 12:
              raise SystemExit("grammar-aware checkpoint must reach epoch 12")
          if checkpoint.get("fit_diagnostic") is not True:
              raise SystemExit("grammar-aware checkpoint must use fit-diagnostic mode")
          if checkpoint.get("grammar_constrained_loss") is not True:
              raise SystemExit("grammar-aware checkpoint must record grammar-constrained loss")
          if checkpoint.get("total_optimizer_updates") != 480:
              raise SystemExit("grammar-aware checkpoint must contain exactly 480 updates")

          inference_checkpoint = {
              "model_id": checkpoint["model_id"],
              "config": checkpoint["config"],
              "epoch": checkpoint["epoch"],
              "seed": checkpoint["seed"],
              "train_loss": checkpoint["train_loss"],
              "validation_loss": checkpoint["validation_loss"],
              "grammar_constrained_loss": checkpoint["grammar_constrained_loss"],
              "model_state": checkpoint["model_state"],
          }
          torch.save(
              inference_checkpoint,
              "build/ml-grammar-checkpoint/development-inference.pt",
          )
          print(
              "PASS: grammar-aware development fit "
              f"train_loss={checkpoint['train_loss']:.6f} "
              f"validation_loss={checkpoint['validation_loss']:.6f}"
          )
          PY

          python3 tools/export_mozart_onnx.py \
            build/ml-grammar-checkpoint/development-inference.pt \
            build/ml-grammar-checkpoint/model.onnx \
            --config docs/model-training-config.json \
            --sequence-length 16 \
            --opset 18

      - name: Evaluate grammar-aware checkpoint autoregression A/B
        if: ${{ always() }}
        id: grammar-aware-evaluation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f build/ml-grammar-checkpoint/development-inference.pt
          test -f build/ml-grammar-checkpoint/model.onnx

          set +e
          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-grammar-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-grammar-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-conditioning-fixture/sequence-probes.json \
            --require-valid-grammar \
            --seed 42 \
            --output build/ml-grammar-checkpoint/conditioning-sequence-raw.json
          raw_status=$?

          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-grammar-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-grammar-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-conditioning-fixture/sequence-probes.json \
            --grammar-constrained \
            --no-require-divergence \
            --require-valid-grammar \
            --require-distribution-response \
            --min-distribution-total-variation 0.05 \
            --seed 42 \
            --output build/ml-grammar-checkpoint/conditioning-sequence-constrained.json
          constrained_status=$?

          python3 tools/evaluate_mozart_conditioning_teacher_forced.py \
            build/ml-grammar-checkpoint/development-inference.pt \
            build/ml-conditioning-fixture/train.jsonl \
            build/ml-conditioning-fixture/sequence-probes.json \
            --config docs/model-training-config.json \
            --onnx build/ml-grammar-checkpoint/model.onnx \
            --window-size 8 \
            --output build/ml-grammar-checkpoint/conditioning-teacher-forced.json
          teacher_status=$?

          RAW_STATUS="$raw_status" \
          CONSTRAINED_STATUS="$constrained_status" \
          TEACHER_STATUS="$teacher_status" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "raw_status": int(os.environ["RAW_STATUS"]),
              "grammar_constrained_status": int(os.environ["CONSTRAINED_STATUS"]),
              "teacher_forced_status": int(os.environ["TEACHER_STATUS"]),
          }
          report["status"] = (
              "PASS"
              if report["grammar_constrained_status"] == 0
              and report["teacher_forced_status"] == 0
              else "FAIL"
          )
          Path("build/ml-grammar-checkpoint/ab-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

          if [[ "$constrained_status" -ne 0 || "$teacher_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Enforce development conditioning gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          constrained_outcome="${{ steps.grammar-constrained-evaluation.outcome }}"
          teacher_outcome="${{ steps.teacher-forced-evaluation.outcome }}"
          if [[ "$constrained_outcome" != "success" ]]; then
            echo "FAIL: grammar-constrained conditioning gate outcome=$constrained_outcome"
            exit 1
          fi
          if [[ "$teacher_outcome" != "success" ]]; then
            echo "FAIL: teacher-forced conditioning diagnostic outcome=$teacher_outcome"
            exit 1
          fi
          echo "PASS: grammar-constrained conditioning gates passed"

      - name: Summarize teacher-forced semantic A/B
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              candidate = Path(path)
              if not candidate.exists():
                  return None
              return json.loads(candidate.read_text(encoding="utf-8"))

          development = load("build/ml-checkpoint/conditioning-teacher-forced.json")
          grammar_aware = load("build/ml-grammar-checkpoint/conditioning-teacher-forced.json")

          def summarize(report):
              if report is None:
                  return None
              keys = (
                  "status",
                  "observed_teacher_forced_steps",
                  "native_target_top1_steps",
                  "native_legal_target_top1_steps",
                  "controls_with_both_targets_top1",
                  "controls_with_both_legal_targets_top1",
                  "controls_with_bidirectional_target_response",
                  "target_probability_directional_response_rate",
                  "target_family_probability_directional_response_rate",
                  "mean_target_probability_delta_native_minus_counterfactual",
                  "mean_target_family_probability_delta_native_minus_counterfactual",
                  "mean_target_probability_tv_alignment",
                  "mean_distribution_total_variation_native_vs_counterfactual",
              )
              return {key: report.get(key) for key in keys}

          summary = {
              "status": "PASS",
              "development": summarize(development),
              "grammar_aware": summarize(grammar_aware),
          }
          reports = (development, grammar_aware)
          statuses = [
              report.get("status")
              for report in reports
              if report is not None
          ]
          if not statuses:
              summary["status"] = "NO_REPORTS"
          elif any(status != "PASS" for status in statuses):
              summary["status"] = "FAIL"
          elif len(statuses) != len(reports):
              summary["status"] = "PARTIAL"
          Path("build/ml-semantic-ab-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Run context-diversity fit diagnostic
        if: ${{ inputs.run_diversity_experiment }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ml-diverse-conditioning-fixture build/ml-diverse-checkpoint
          python3 tools/build_conditioning_fixture_corpus.py \
            build/ml-diverse-conditioning-fixture \
            --context-variant-count 10

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/ml-diverse-conditioning-fixture")
          records = [
              json.loads(line)
              for line in (root / "records.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for split in ("train", "validation"):
              selected = [record for record in records if record["split"] == split]
              if not selected:
                  raise SystemExit(f"missing {split} records")
              (root / f"{split}.jsonl").write_text(
                  "".join(json.dumps(record, sort_keys=True) + "\n" for record in selected),
                  encoding="utf-8",
              )
          if len(records) != 22:
              raise SystemExit(f"expected 22 diverse records, got {len(records)}")
          train_count = sum(record["split"] == "train" for record in records)
          if train_count != 20:
              raise SystemExit(f"expected 20 diverse train records, got {train_count}")
          PY

          python3 tools/train_mozart_model.py \
            build/ml-diverse-conditioning-fixture/train.jsonl \
            --validation-jsonl build/ml-diverse-conditioning-fixture/validation.jsonl \
            --output-dir build/ml-diverse-checkpoint \
            --epochs 12 \
            --batch-size 4 \
            --repeat-train-records 8 \
            --learning-rate 3e-4 \
            --fit-diagnostic \
            --seed 42 \
            --device cpu

          python3 - <<'PY'
          import torch
          from pathlib import Path

          checkpoint = torch.load(
              "build/ml-diverse-checkpoint/latest.pt",
              map_location="cpu",
              weights_only=False,
          )
          if checkpoint.get("total_optimizer_updates") != 480:
              raise SystemExit(
                  "diversity diagnostic must contain exactly 480 optimizer updates"
              )
          if checkpoint.get("repeat_train_records") != 8:
              raise SystemExit("diversity diagnostic repeat factor must be 8")
          inference_checkpoint = {
              "model_id": checkpoint["model_id"],
              "config": checkpoint["config"],
              "epoch": checkpoint["epoch"],
              "seed": checkpoint["seed"],
              "train_loss": checkpoint["train_loss"],
              "validation_loss": checkpoint["validation_loss"],
              "grammar_constrained_loss": checkpoint["grammar_constrained_loss"],
              "model_state": checkpoint["model_state"],
          }
          torch.save(
              inference_checkpoint,
              "build/ml-diverse-checkpoint/development-inference.pt",
          )
          PY

          python3 tools/export_mozart_onnx.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            build/ml-diverse-checkpoint/model.onnx \
            --config docs/model-training-config.json \
            --sequence-length 16 \
            --opset 18

          python3 tools/evaluate_mozart_conditioning_teacher_forced.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            build/ml-diverse-conditioning-fixture/train.jsonl \
            build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --config docs/model-training-config.json \
            --onnx build/ml-diverse-checkpoint/model.onnx \
            --window-size 8 \
            --output build/ml-diverse-checkpoint/conditioning-teacher-forced.json

          python3 tools/evaluate_mozart_conditioning_sequence.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-diverse-checkpoint/model.onnx \
            --max-generated-tokens 32 \
            --low-value 0.1 \
            --high-value 0.9 \
            --base-value 0.5 \
            --probe-file build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --grammar-constrained \
            --no-require-divergence \
            --require-valid-grammar \
            --require-distribution-response \
            --min-distribution-total-variation 0.05 \
            --seed 42 \
            --output build/ml-diverse-checkpoint/conditioning-sequence-grammar-constrained.json
      - name: Summarize context-diversity experiment
        if: ${{ always() && inputs.run_diversity_experiment }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              candidate = Path(path)
              if not candidate.exists():
                  return None
              return json.loads(candidate.read_text(encoding="utf-8"))

          baseline_teacher = load("build/ml-checkpoint/conditioning-teacher-forced.json")
          diverse_teacher = load("build/ml-diverse-checkpoint/conditioning-teacher-forced.json")
          baseline_sequence = load(
              "build/ml-checkpoint/conditioning-sequence-grammar-constrained.json"
          )
          diverse_sequence = load(
              "build/ml-diverse-checkpoint/conditioning-sequence-grammar-constrained.json"
          )

          def summarize_teacher(report):
              if report is None:
                  return None
              keys = (
                  "status",
                  "observed_teacher_forced_steps",
                  "native_target_top1_steps",
                  "native_legal_target_top1_steps",
                  "controls_with_both_legal_targets_top1",
                  "controls_with_bidirectional_target_response",
                  "target_probability_directional_response_rate",
                  "target_family_probability_directional_response_rate",
                  "mean_target_probability_delta_native_minus_counterfactual",
                  "mean_target_family_probability_delta_native_minus_counterfactual",
                  "mean_target_probability_tv_alignment",
                  "mean_distribution_total_variation_native_vs_counterfactual",
              )
              return {key: report.get(key) for key in keys}

          def summarize_sequence(report):
              if report is None:
                  return None
              keys = (
                  "status",
                  "grammar_constrained",
                  "require_valid_grammar",
                  "require_distribution_response",
                  "min_distribution_total_variation",
                  "max_generated_tokens",
                  "failures",
              )
              return {key: report.get(key) for key in keys}

          reports = (
              baseline_teacher,
              diverse_teacher,
              baseline_sequence,
              diverse_sequence,
          )
          available_statuses = [
              report.get("status")
              for report in reports
              if report is not None
          ]
          diverse_reports = (diverse_teacher, diverse_sequence)

          if not available_statuses:
              experiment_status = "NO_REPORTS"
          elif any(status != "PASS" for status in available_statuses):
              experiment_status = "FAIL"
          elif any(report is None for report in diverse_reports):
              experiment_status = "PARTIAL"
          else:
              experiment_status = "PASS"

          summary = {
              "status": experiment_status,
              "baseline": {
                  "teacher_forced": summarize_teacher(baseline_teacher),
                  "grammar_constrained_sequence": summarize_sequence(baseline_sequence),
              },
              "context_diverse": {
                  "teacher_forced": summarize_teacher(diverse_teacher),
                  "grammar_constrained_sequence": summarize_sequence(diverse_sequence),
              },
          }
          Path("build/ml-context-diversity-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload development ML artifacts
        if: ${{ always() && hashFiles('build/ml-checkpoint/development-inference.pt', 'build/ml-checkpoint/model.onnx', 'build/ml-checkpoint/abi.json', 'build/ml-checkpoint/conditioning-response.json', 'build/ml-checkpoint/conditioning-sequence-response.json', 'build/ml-checkpoint/conditioning-sequence-grammar-constrained.json', 'build/ml-checkpoint/conditioning-teacher-forced.json', 'build/ml-conditioning-fixture/sequence-probes.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-development-ml-${{ github.sha }}
          path: |
            build/ml-checkpoint/development-inference.pt
            build/ml-checkpoint/model.onnx
            build/ml-checkpoint/abi.json
            build/ml-checkpoint/conditioning-response.json
            build/ml-checkpoint/conditioning-sequence-response.json
            build/ml-checkpoint/conditioning-sequence-grammar-constrained.json
            build/ml-checkpoint/conditioning-teacher-forced.json
            build/ml-semantic-ab-summary.json
            build/ml-conditioning-fixture/sequence-probes.json
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload context-diversity experiment artifacts
        if: ${{ always() && hashFiles('build/ml-diverse-checkpoint/**', 'build/ml-diverse-conditioning-fixture/**', 'build/ml-context-diversity-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-context-diversity-ml-${{ github.sha }}
          path: |
            build/ml-diverse-checkpoint/**
            build/ml-diverse-conditioning-fixture/**
            build/ml-context-diversity-summary.json
          archive: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload grammar-aware ML A/B artifacts
        if: ${{ always() && hashFiles('build/ml-grammar-checkpoint/development-inference.pt', 'build/ml-grammar-checkpoint/model.onnx', 'build/ml-grammar-checkpoint/conditioning-sequence-raw.json', 'build/ml-grammar-checkpoint/conditioning-sequence-constrained.json', 'build/ml-grammar-checkpoint/conditioning-teacher-forced.json', 'build/ml-grammar-checkpoint/ab-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-grammar-aware-ml-${{ github.sha }}
          path: |
            build/ml-grammar-checkpoint/development-inference.pt
            build/ml-grammar-checkpoint/model.onnx
            build/ml-grammar-checkpoint/conditioning-sequence-raw.json
            build/ml-grammar-checkpoint/conditioning-sequence-constrained.json
            build/ml-grammar-checkpoint/conditioning-teacher-forced.json
            build/ml-grammar-checkpoint/ab-summary.json
          archive: true
          if-no-files-found: error
          retention-days: 14
