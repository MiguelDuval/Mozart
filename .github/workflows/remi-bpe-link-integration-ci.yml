name: REMI-BPE Link Integration Tests

on:
  push:
    branches:
      - "feature/remi-bpe-link-integration"
    paths:
      - "src/remi/**"
      - "src/generation/RemiToLinkPatternConverter.*"
      - "src/generation/RemiBpePatternProvider.*"
      - "src/generation/RemiBpeInferenceBackend.h"
      - "src/generation/GenerationService.*"
      - "src/runtime/MozartRuntime.*"
      - "tests/MozartCoreTests.cpp"
      - "tests/RemiToLinkConverterTests.cpp"
      - "tests/GenerationServiceTests.cpp"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "third_party/nlohmann/json.hpp"
      - ".github/workflows/android-build.yml"
      - "docs/AI_MODEL_COLLABORATION_LOG.md"
      - ".github/workflows/remi-bpe-link-integration-ci.yml"
  pull_request:
    branches:
      - "feature/link-clock"
    paths:
      - "src/remi/**"
      - "src/generation/RemiToLinkPatternConverter.*"
      - "src/runtime/MozartRuntime.*"
      - "tests/MozartCoreTests.cpp"
      - "tests/RemiToLinkConverterTests.cpp"
      - "tests/CMakeLists.txt"
      - "third_party/nlohmann/json.hpp"
      - ".github/workflows/android-build.yml"
      - "docs/AI_MODEL_COLLABORATION_LOG.md"
      - ".github/workflows/remi-bpe-link-integration-ci.yml"
  workflow_dispatch:

concurrency:
  group: remi-bpe-link-integration-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  converter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Configure focused native tests
        run: cmake -S tests -B build/remi-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build REMI-to-Link converter tests
        run: cmake --build build/remi-tests --target mozart_remi_to_link_converter_tests --parallel 2

      - name: Run REMI-to-Link converter tests
        run: ./build/remi-tests/mozart_remi_to_link_converter_tests

      - name: Build REMI generation-service integration tests
        run: cmake --build build/remi-tests --target mozart_generation_service_tests --parallel 2

      - name: Run REMI generation-service integration tests
        run: ./build/remi-tests/mozart_generation_service_tests

      - name: Fetch pinned Ableton Link
        run: bash tools/fetch_link.sh

      - name: Configure Link runtime tests
        run: cmake -S tests -B build/link-runtime-tests -DMOZART_ENABLE_LINK=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build Link runtime tests
        run: cmake --build build/link-runtime-tests --target mozart_core_tests --parallel 2

      - name: Run Link runtime tests
        run: ./build/link-runtime-tests/mozart_core_tests
