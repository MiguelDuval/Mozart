name: REMI/BPE Real Checkpoint Export Smoke

on:
  push:
    branches:
      - "feature/remi-bpe-link-integration"
    paths:
      - ".github/workflows/remi-bpe-real-model-export.yml"
      - "tools/export_remi_bpe_onnx.py"
      - "tools/run_remi_bpe_onnx_smoke.py"
      - "tools/requirements-onnx-export.txt"
      - "tools/requirements-remi-onnx-export.txt"
      - "tests/RemiBpeExternalArtifactSmoke.cpp"
      - "third_party/nlohmann/json.hpp"
      - "src/remi/BpeTokenizer.h"
      - "src/remi/BpeTokenizer.cpp"
      - "src/remi/RemiDecoderConfig.h"
      - "src/remi/RemiDecoderConfig.cpp"
      - "src/remi/RemiEventAdapter.h"
      - "src/remi/RemiEventAdapter.cpp"
      - "src/remi/GenerationTypes.h"
      - "src/remi/GenerationTypes.cpp"
      - "src/generation/RemiBpeInferenceBackend.h"
      - "src/generation/RemiBpePatternProvider.h"
      - "src/generation/RemiBpePatternProvider.cpp"
      - "src/generation/RemiToLinkPatternConverter.h"
      - "src/generation/RemiToLinkPatternConverter.cpp"
      - "src/generation/PatternProposal.h"
      - "src/generation/GenerationRequest.h"
      - "src/musical/KeyScale.h"
      - "src/musical/KeyScale.cpp"
      - "src/musical/Chord.h"
      - "src/musical/Chord.cpp"
  workflow_dispatch:

concurrency:
  group: remi-bpe-real-checkpoint-smoke-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_ID: NathanFradet/Maestro-REMI-bpe20k
      MODEL_REVISION: ec0960a622b46d77ed59fdd09de422aa205ca6a4
      EXPORT_DIR: /tmp/mozart-remi-bpe-real-export
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-remi-onnx-export.txt

      - name: Install pinned CPU ONNX exporter
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-remi-onnx-export.txt
          python3 -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub==0.23.4

      - name: Download immutable public model/tokenizer pair outside the repository
        id: download-model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          MODEL_DIR="$(python3 - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download(
              repo_id="NathanFradet/Maestro-REMI-bpe20k",
              revision="ec0960a622b46d77ed59fdd09de422aa205ca6a4",
              allow_patterns=["config.json", "tokenizer.json", "model.safetensors", "generation_config.json"],
          ))
          PY
          )"
          test -f "$MODEL_DIR/config.json"
          test -f "$MODEL_DIR/tokenizer.json"
          test -f "$MODEL_DIR/model.safetensors"
          echo "model_dir=$MODEL_DIR" >> "$GITHUB_OUTPUT"
          python3 - "$MODEL_DIR" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          cfg = json.loads((p / "config.json").read_text(encoding="utf-8"))
          if cfg.get("model_type") != "gpt2" or cfg.get("vocab_size") != 20000:
              raise SystemExit(f"unexpected pinned candidate config: model_type={cfg.get('model_type')!r}, vocab={cfg.get('vocab_size')!r}")
          print(f"Checkpoint config verified: {cfg['model_type']} vocab={cfg['vocab_size']} context={cfg.get('n_positions')}")
          PY

      - name: Export and validate the real paired checkpoint
        shell: bash
        env:
          MODEL_DIR: ${{ steps.download-model.outputs.model_dir }}
        run: |
          set -euo pipefail
          python3 tools/export_remi_bpe_onnx.py \
            --model-dir "$MODEL_DIR" \
            --output "$EXPORT_DIR/model.onnx" \
            --manifest "$EXPORT_DIR/model.manifest.json" \
            --model-id "$MODEL_ID" \
            --model-revision "$MODEL_REVISION" \
            --sample-sequence-length 8 \
            --max-generated-tokens 400 \
            --opset 17
          python3 tools/validate_model_manifest.py "$EXPORT_DIR/model.manifest.json"

      - name: Run bounded real ONNX autoregressive inference
        run: |
          set -euo pipefail
          python3 tools/run_remi_bpe_onnx_smoke.py \
            --model "$EXPORT_DIR/model.onnx" \
            --manifest "$EXPORT_DIR/model.manifest.json" \
            --output-token-ids "$EXPORT_DIR/generated-token-ids.json" \
            --max-new-tokens 64

      - name: Verify the exact ONNX-generated IDs with Mozart C++ tokenizer
        shell: bash
        env:
          MODEL_DIR: ${{ steps.download-model.outputs.model_dir }}
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 \
            -Isrc -Ithird_party/nlohmann \
            tests/RemiBpeExternalArtifactSmoke.cpp \
            src/remi/BpeTokenizer.cpp \
            src/remi/RemiDecoderConfig.cpp \
            src/remi/RemiEventAdapter.cpp \
            src/remi/GenerationTypes.cpp \
            src/generation/RemiBpePatternProvider.cpp \
            src/generation/RemiToLinkPatternConverter.cpp \
            src/musical/KeyScale.cpp \
            src/musical/Chord.cpp \
            -o "$EXPORT_DIR/remi-bpe-artifact-smoke"
          "$EXPORT_DIR/remi-bpe-artifact-smoke" \
            "$MODEL_DIR/tokenizer.json" \
            "$MODEL_DIR/config.json" \
            "$EXPORT_DIR/generated-token-ids.json" \
            "$EXPORT_DIR/cpp-tokenizer-report.json"

      - name: Write non-weight artifact verification report
        run: |
          set -euo pipefail
          python3 - "$EXPORT_DIR/model.manifest.json" "$EXPORT_DIR/generated-token-ids.json" "$EXPORT_DIR/cpp-tokenizer-report.json" "$EXPORT_DIR/verification-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifest_path, ids_path, cpp_path, out_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          ids = json.loads(ids_path.read_text(encoding="utf-8"))
          cpp_report = json.loads(cpp_path.read_text(encoding="utf-8"))
          if cpp_report.get("status") != "verified" or cpp_report.get("all_vocab_entries_decodable") is not True:
              raise SystemExit("C++ real-tokenizer verification report is not fully verified")
          if cpp_report.get("production_provider_initialized") is not True:
              raise SystemExit("Mozart production REMI/BPE provider failed to load the actual paired tokenizer")
          if cpp_report.get("production_provider_inference_calls") != 1:
              raise SystemExit("production provider did not replay the exact ONNX-generated stream once")
          if cpp_report.get("complete_bos_eos_stream") is False:
              message = str(cpp_report.get("production_provider_message", ""))
              if (
                  cpp_report.get("production_provider_status") != "failed"
                  or cpp_report.get("production_provider_ready") is not False
                  or cpp_report.get("production_provider_note_count") != 0
                  or cpp_report.get("production_provider_control_count") != 0
                  or "BOS/EOS terminated" not in message
              ):
                  raise SystemExit("unterminated real output was not rejected atomically by the production provider")
              provider_gate_status = "production_provider_correctly_rejected_unterminated_stream"
          elif cpp_report.get("production_provider_ready") is True:
              provider_gate_status = "production_provider_accepted_complete_stream"
          else:
              if (
                  cpp_report.get("production_provider_status") != "failed"
                  or cpp_report.get("production_provider_note_count") != 0
                  or cpp_report.get("production_provider_control_count") != 0
              ):
                  raise SystemExit("production provider did not fail closed on the complete model output")
              provider_gate_status = "production_provider_correctly_rejected_complete_stream"
          if cpp_report.get("semantic_proposal_valid") is not True:
              raise SystemExit("actual ONNX output has no valid complete-event REMI proposal")
          if cpp_report.get("semantic_adapter_status") not in {"valid_proposal", "valid_diagnostic_prefix"}:
              raise SystemExit("Mozart's typed REMI adapter rejected all tested output boundaries")
          if cpp_report.get("link_conversion_status") != "accepted":
              raise SystemExit("Mozart's REMI-to-Link converter rejected the tested output")
          if cpp_report.get("request_validation_status") != "accepted":
              raise SystemExit("Mozart's shared request-aware validator rejected the tested output")
          diagnostic_prefix = cpp_report.get("semantic_diagnostic_prefix_used") is True
          if diagnostic_prefix:
              if (
                  cpp_report.get("provider_ready") is not False
                  or cpp_report.get("complete_bos_eos_stream") is not False
                  or int(cpp_report.get("semantic_tokens_omitted_for_diagnostic", 0)) < 1
                  or cpp_report.get("semantic_adapter_status") != "valid_diagnostic_prefix"
              ):
                  raise SystemExit("diagnostic-prefix report has inconsistent provider readiness/truncation fields")
              integration_path_status = "diagnostic_prefix_adapter_link_verified_provider_not_ready"
          elif cpp_report.get("provider_ready") is True:
              if cpp_report.get("complete_bos_eos_stream") is not True:
                  raise SystemExit("provider-ready report lacks a complete BOS/EOS stream")
              integration_path_status = "provider_ready"
          elif cpp_report.get("complete_bos_eos_stream") is not True:
              integration_path_status = "adapter_link_path_verified_but_eos_not_produced"
          else:
              integration_path_status = "full_stream_converted_but_provider_gate_not_satisfied"
          report = {
              "status": "verified",
              "production_provider_gate_status": provider_gate_status,
              "integration_path_status": integration_path_status,
              "model_use": "technical_integration_fixture_only_not_broad_edm",
              "model_id": manifest["model_id"],
              "model_revision": manifest["model_revision"],
              "model_architecture": manifest.get("model_architecture"),
              "loader_class": manifest.get("loader_class"),
              "transformers_version": manifest.get("transformers_version"),
              "model_sha256": manifest["model_sha256"],
              "tokenizer_sha256": manifest["runtime"]["tokenizer_sha256"],
              "config_sha256": manifest["source_config_sha256"],
              "vocabulary_id": manifest["vocabulary_id"],
              "vocabulary_size": manifest["vocabulary_size"],
              "context_length_tokens": manifest["context_length_tokens"],
              "max_generated_tokens": manifest["max_generated_tokens"],
              "actual_generated_token_count_including_bos": len(ids),
              "cpp_tokenizer_verification": cpp_report,
              "tokenizer_artifact_included": False,
              "checkpoint_weights_included": False,
              "exported_onnx_included": False,
          }
          out_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload verification report only (never model weights or ONNX graph)
        uses: actions/upload-artifact@v7
        with:
          name: mozart-remi-bpe-real-checkpoint-report-${{ github.sha }}
          path: ${{ env.EXPORT_DIR }}/verification-report.json
          if-no-files-found: error
          retention-days: 14
