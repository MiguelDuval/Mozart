name: Mozart ML Categorical Composition Sparse Seed Replication

on:
  push:
    branches:
      - "feature/categorical-composition-sparse-seed-replication"
    paths:
      - ".github/workflows/ml-categorical-composition-sparse-seed-replication.yml"
      - "tools/train_mozart_model.py"
      - "tools/build_categorical_composition_fixture.py"
      - "tools/evaluate_mozart_categorical_composition.py"
      - "tools/export_mozart_onnx.py"
      - "tools/mozart_model.py"
      - "tools/mozart_conditioning.py"
      - "tools/mozart_token_grammar.py"
      - "docs/model-training-config.json"
      - "tools/requirements-onnx-export.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Build sparse coverage fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ml-categorical-composition-sparse-seeds
          python3 tools/build_categorical_composition_fixture.py \
            build/ml-categorical-composition-sparse-seeds/fixture \
            --training-profile sparse-multi-axis

      - name: Train and evaluate seeds 42, 1337, 2027
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ml-categorical-composition-sparse-seeds/reports

          for seed in 42 1337 2027; do
            rm -rf "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed"

            python3 tools/train_mozart_model.py \
              "build/ml-categorical-composition-sparse-seeds/fixture/train.jsonl" \
              --validation-jsonl \
              "build/ml-categorical-composition-sparse-seeds/fixture/validation.jsonl" \
              --output-dir \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed" \
              --epochs 12 \
              --batch-size 4 \
              --repeat-train-records 5 \
              --learning-rate 3e-4 \
              --fit-diagnostic \
              --seed "$seed" \
              --device cpu

            SEED="$seed" python3 - <<'PY'
          import math
          import os
          from pathlib import Path
          import torch

          seed = os.environ["SEED"]
          path = Path(f"build/ml-categorical-composition-sparse-seeds/checkpoint-{seed}/latest.pt")
          checkpoint = torch.load(path, map_location="cpu", weights_only=False)

          checks = {
              "total_optimizer_updates": checkpoint.get("total_optimizer_updates") == 480,
              "epoch": checkpoint.get("epoch") == 12,
              "repeat_train_records": checkpoint.get("repeat_train_records") == 5,
          }
          for field in ("train_loss", "validation_loss"):
              value = checkpoint.get(field)
              checks[field] = isinstance(value, (int, float)) and math.isfinite(value)
          for name, ok in checks.items():
              if not ok:
                  raise SystemExit(f"seed {seed}: failed checkpoint assertion {name}")

          print(
              f"SEED {seed} LATEST epoch={checkpoint['epoch']} "
              f"validation_loss={checkpoint['validation_loss']:.6f}"
          )

          best_path = path.parent / "best.pt"
          best = torch.load(best_path, map_location="cpu", weights_only=False)
          if best.get("epoch") is None or not isinstance(best.get("validation_loss"), (int, float)):
              raise SystemExit(f"seed {seed}: best checkpoint metadata is invalid")

          torch.save(
              {
                  "model_id": best["model_id"],
                  "config": best["config"],
                  "epoch": best["epoch"],
                  "seed": best["seed"],
                  "train_loss": best["train_loss"],
                  "validation_loss": best["validation_loss"],
                  "model_state": best["model_state"],
              },
              path.parent / "development-inference.pt",
          )
          print(
              f"SEED {seed} SELECTED epoch={best['epoch']} "
              f"validation_loss={best['validation_loss']:.6f}"
          )
          PY

            python3 tools/export_mozart_onnx.py \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/development-inference.pt" \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/model.onnx" \
              --config docs/model-training-config.json \
              --sequence-length 64 \
              --opset 18

            python3 tools/evaluate_mozart_categorical_composition.py \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/development-inference.pt" \
              "build/ml-categorical-composition-sparse-seeds/fixture/test.jsonl" \
              "build/ml-categorical-composition-sparse-seeds/fixture/composition-probes.json" \
              --config docs/model-training-config.json \
              --onnx \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/model.onnx" \
              --window-size 8 \
              --max-generated-tokens 32 \
              --output \
              "build/ml-categorical-composition-sparse-seeds/reports/seed-$seed.json"

            rm -f \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/latest.pt" \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/best.pt" \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/development-inference.pt" \
              "build/ml-categorical-composition-sparse-seeds/checkpoint-$seed/model.onnx"
          done

      - name: Summarize seed sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path("build/ml-categorical-composition-sparse-seeds")
          seeds = (42, 1337, 2027)
          expected_counts = {"two_axis": 3, "three_axis": 6, "all_five": 1}
          per_seed = {}

          for seed in seeds:
              report_path = root / "reports" / f"seed-{seed}.json"
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if report.get("status") != "PASS":
                  raise SystemExit(f"seed {seed}: evaluator status is not PASS")

              # Evaluator predates sparse mode and emits a legacy regime label.
              # The fixture used by this workflow is authoritative; correct only
              # the derived summary/report copy, not the evaluator implementation.
              report["training_regime"] = "sparse-multi-axis"
              report_path.write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              groups = {"two_axis": [], "three_axis": [], "all_five": []}
              for profile, value in report["results"].items():
                  n_axes = len(value["axes"])
                  group = (
                      "two_axis"
                      if n_axes == 2
                      else "three_axis"
                      if n_axes == 3
                      else "all_five"
                      if n_axes == 5
                      else None
                  )
                  if group is None:
                      raise SystemExit(f"seed {seed}: unsupported axis count for {profile}")
                  groups[group].append({
                      "profile": profile,
                      "ar_mean_tv": value["autoregressive"]["mean_total_variation"],
                      "first_divergence": value["autoregressive"]["first_divergence_generated_index"],
                      "ar_parity": value["autoregressive"]["parity_max_abs_error"],
                      "interaction_residual_ratio": value["logit_additivity_at_divergence"]["interaction_residual_ratio"],
                      "actual_vs_additive_cosine": value["logit_additivity_at_divergence"]["actual_vs_additive_cosine"],
                      "tf_mean_tv": value["teacher_forced"]["mean_base_vs_combo_total_variation"],
                      "tf_target_delta": value["teacher_forced"]["mean_target_probability_delta"],
                      "tf_parity": value["teacher_forced"]["parity_max_abs_error"],
                  })

              for group, count in expected_counts.items():
                  if len(groups[group]) != count:
                      raise SystemExit(
                          f"seed {seed}: {group} expected {count} profiles, got {len(groups[group])}"
                      )

              per_seed[str(seed)] = groups

          metric_names = (
              "ar_mean_tv",
              "interaction_residual_ratio",
              "actual_vs_additive_cosine",
              "tf_mean_tv",
              "tf_target_delta",
          )
          aggregate = {}
          for group in expected_counts:
              aggregate[group] = {}
              for metric in metric_names:
                  values = []
                  for seed in seeds:
                      values.append(
                          statistics.mean(
                              item[metric]
                              for item in per_seed[str(seed)][group]
                          )
                      )
                  aggregate[group][metric] = {
                      "seed_42": values[0],
                      "seed_1337": values[1],
                      "seed_2027": values[2],
                      "mean": statistics.mean(values),
                      "stdev": statistics.stdev(values),
                      "min": min(values),
                      "max": max(values),
                  }

          summary = {
              "experiment": "categorical-composition-sparse-coverage-seed-replication",
              "training_regime": "sparse-multi-axis",
              "fixture_revision": "mozart-categorical-composition-fixture-v1-sparse-coverage",
              "seeds": list(seeds),
              "optimizer_updates_per_seed": 480,
              "profile_counts": expected_counts,
              "per_seed": per_seed,
              "aggregate": aggregate,
          }
          (root / "seed-replication-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          for group, metrics in aggregate.items():
              ar = metrics["ar_mean_tv"]
              interaction = metrics["interaction_residual_ratio"]
              print(
                  f"{group}: "
                  f"AR mean TV mean={ar['mean']:.6f}, range={ar['min']:.6f}-{ar['max']:.6f}; "
                  f"interaction mean={interaction['mean']:.6f}, "
                  f"range={interaction['min']:.6f}-{interaction['max']:.6f}"
              )
          PY

      - name: Remove checkpoint directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            build/ml-categorical-composition-sparse-seeds/checkpoint-42 \
            build/ml-categorical-composition-sparse-seeds/checkpoint-1337 \
            build/ml-categorical-composition-sparse-seeds/checkpoint-2027

      - name: Publish seed replication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-categorical-composition-sparse-seed-replication
          path: |
            build/ml-categorical-composition-sparse-seeds/seed-replication-summary.json
            build/ml-categorical-composition-sparse-seeds/reports/seed-42.json
            build/ml-categorical-composition-sparse-seeds/reports/seed-1337.json
            build/ml-categorical-composition-sparse-seeds/reports/seed-2027.json
            build/ml-categorical-composition-sparse-seeds/fixture/fixture-metadata.json
            build/ml-categorical-composition-sparse-seeds/fixture/composition-probes.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: false
