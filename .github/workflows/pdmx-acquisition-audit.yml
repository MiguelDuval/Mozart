name: PDMX Acquisition Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/link-clock"
    paths:
      - ".github/workflows/pdmx-acquisition-audit.yml"
      - "docs/pdmx-acquisition-manifest-v9.json"
      - "tools/audit_pdmx_source.py"
      - "tools/verify_pdmx_artifact.py"
      - "tools/validate_pdmx_acquisition_manifest.py"

permissions:
  contents: read

concurrency:
  group: pdmx-acquisition-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate pinned acquisition manifest
        run: |
          set -euo pipefail
          python3 tools/validate_pdmx_acquisition_manifest.py docs/pdmx-acquisition-manifest-v9.json

      - name: Download PDMX v9 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdmx"
          cd "$RUNNER_TEMP/pdmx"

          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            -o mid.tar.gz \
            "https://zenodo.org/records/15571083/files/mid.tar.gz?download=1"

          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            -o PDMX.csv \
            "https://zenodo.org/records/15571083/files/PDMX.csv?download=1"

          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            -o subset_paths.tar.gz \
            "https://zenodo.org/records/15571083/files/subset_paths.tar.gz?download=1"

          ls -lh

      - name: Verify published MD5 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pdmx"
          md5sum mid.tar.gz PDMX.csv subset_paths.tar.gz
          test "$(md5sum mid.tar.gz | awk '{print $1}')" = "d920a21b2fcd99a56d9c381b39debbb2"
          test "$(md5sum PDMX.csv | awk '{print $1}')" = "30392ccf38bb63ce70e7afae70f9c88c"
          test "$(md5sum subset_paths.tar.gz | awk '{print $1}')" = "092eee416ece8060f77d08575b94a43d"

      - name: Record local SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pdmx"
          sha256sum mid.tar.gz PDMX.csv subset_paths.tar.gz | tee "$RUNNER_TEMP/pdmx-artifact-sha256.txt"

      - name: Extract recommended subset manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pdmx"
          member="$(tar -tzf subset_paths.tar.gz | grep -E '(^|/)no_license_conflict\.txt$' | head -n 1)"
          test -n "$member"
          printf 'subset_member=%s\n' "$member" | tee "$RUNNER_TEMP/pdmx/subset-member.txt"
          tar -xOzf subset_paths.tar.gz "$member" > "$RUNNER_TEMP/pdmx/no_license_conflict.txt"
          test -s "$RUNNER_TEMP/pdmx/no_license_conflict.txt"

      - name: Run PDMX technical provenance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_pdmx_source.py \
            "$RUNNER_TEMP/pdmx/PDMX.csv" \
            "$RUNNER_TEMP/pdmx/no_license_conflict.txt" \
            --midi-source "$RUNNER_TEMP/pdmx/mid.tar.gz" \
            --output "$RUNNER_TEMP/pdmx/pdmx-audit-v9.json"

      - name: Save audit report only
        uses: actions/upload-artifact@v7
        with:
          name: pdmx-v9-audit-\${{ github.sha }}
          path: |
            \${{ runner.temp }}/pdmx/pdmx-audit-v9.json
            \${{ runner.temp }}/pdmx-artifact-sha256.txt
            \${{ runner.temp }}/pdmx/subset-member.txt
          if-no-files-found: error
          retention-days: 30
