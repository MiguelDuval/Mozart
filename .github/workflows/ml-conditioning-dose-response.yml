name: Mozart Conditioning Dose Response

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
    paths:
      - ".github/workflows/ml-conditioning-dose-response.yml"
      - "research/run-conditioning-dose-response.trigger"

concurrency:
  group: mozart-ml-conditioning-dose-response
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replicate:
    if: >-
      github.ref_name != 'main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[run-conditioning-dose-response]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 42, 123]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Validate dose-response contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_evaluate_mozart_conditioning_dose_response.py'
          python3 -m unittest discover -s tests -p 'test_summarize_mozart_conditioning_dose_response.py'
          python3 -m unittest discover -s tests -p 'test_build_conditioning_fixture_corpus.py'
          python3 -m unittest discover -s tests -p 'test_validate_mozart_conditioning_ab.py'

      - name: Build corrected v2 fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          python3 tools/build_conditioning_fixture_corpus.py \
            build/ml-diverse-conditioning-fixture \
            --context-variant-count 10

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/ml-diverse-conditioning-fixture")
          records = [json.loads(line) for line in (root / "records.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          for split in ("train", "validation", "test"):
              selected = [record for record in records if record["split"] == split]
              (root / f"{split}.jsonl").write_text("".join(json.dumps(record, sort_keys=True) + "\n" for record in selected), encoding="utf-8")
          if len(records) != 26:
              raise SystemExit(f"expected 26 records, got {len(records)}")
          if sum(record["split"] == "train" for record in records) != 20:
              raise SystemExit("expected 20 diverse train records")
          if sum(record["split"] == "validation" for record in records) != 4:
              raise SystemExit("expected 4 diverse validation records")
          metadata = json.loads((root / "fixture-metadata.json").read_text(encoding="utf-8"))
          if metadata["fixture_revision"] != "mozart-conditioning-fixture-v2":
              raise SystemExit("dose-response gate requires fixture v2")
          PY

          python3 tools/build_conditioning_fixture_corpus.py build/ml-base-conditioning-fixture
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/ml-base-conditioning-fixture")
          records = [json.loads(line) for line in (root / "records.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          for split in ("train", "validation", "test"):
              selected = [record for record in records if record["split"] == split]
              (root / f"{split}.jsonl").write_text("".join(json.dumps(record, sort_keys=True) + "\n" for record in selected), encoding="utf-8")
          if len(records) != 16 or sum(record["split"] == "train" for record in records) != 10:
              raise SystemExit("base fixture cardinality mismatch")
          PY

      - name: Build matched-exposure baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = [json.loads(line) for line in Path("build/ml-base-conditioning-fixture/train.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          diverse = [json.loads(line) for line in Path("build/ml-diverse-conditioning-fixture/train.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          base_by_profile = {record["source_path"]: record for record in base}
          matched = []
          for index, record in enumerate(diverse):
              base_path = record["source_path"].replace("-v1.mid", "-v0.mid")
              source = base_by_profile.get(base_path)
              if source is None:
                  raise SystemExit(f"no base target for {base_path!r}")
              duplicate = dict(source)
              duplicate["source_id"] = f"{source['source_id']}-matched-{index:02d}"
              if duplicate["performance_controls"] != record["performance_controls"]:
                  raise SystemExit(f"performance control mismatch at position {index}")
              matched.append(duplicate)
          if len(matched) != 20:
              raise SystemExit("matched arm must contain exactly 20 train positions")
          Path("build/ml-matched-train.jsonl").write_text("".join(json.dumps(record, sort_keys=True) + "\n" for record in matched), encoding="utf-8")
          probes = json.loads(Path("build/ml-diverse-conditioning-fixture/sequence-probes.json").read_text(encoding="utf-8"))
          by_base_id = {}
          for record in matched:
              by_base_id[record["source_id"].split("-matched-", 1)[0]] = record["source_id"]
          for entry in probes["controls"].values():
              entry["low_record_source_id"] = by_base_id[entry["low_record_source_id"]]
              entry["high_record_source_id"] = by_base_id[entry["high_record_source_id"]]
          Path("build/ml-matched-sequence-probes.json").write_text(json.dumps(probes, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 tools/validate_mozart_conditioning_ab.py \
            --base-train-jsonl build/ml-base-conditioning-fixture/train.jsonl \
            --diverse-train-jsonl build/ml-diverse-conditioning-fixture/train.jsonl \
            --matched-train-jsonl build/ml-matched-train.jsonl \
            --probe-json build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --matched-probe-json build/ml-matched-sequence-probes.json \
            > build/ml-dose-response-input-contract.json
          cat build/ml-dose-response-input-contract.json

      - name: Fit matched checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/train_mozart_model.py \
            build/ml-matched-train.jsonl \
            --validation-jsonl build/ml-base-conditioning-fixture/validation.jsonl \
            --output-dir build/ml-matched-checkpoint \
            --epochs 12 \
            --batch-size 4 \
            --repeat-train-records 8 \
            --learning-rate 3e-4 \
            --fit-diagnostic \
            --seed ${{ matrix.seed }} \
            --device cpu
          python3 - <<'PY'
          import torch
          checkpoint = torch.load("build/ml-matched-checkpoint/latest.pt", map_location="cpu", weights_only=False)
          if checkpoint.get("total_optimizer_updates") != 480:
              raise SystemExit("matched fit must contain exactly 480 optimizer updates")
          inference = {key: checkpoint[key] for key in ("model_id", "config", "epoch", "seed", "train_loss", "validation_loss", "grammar_constrained_loss", "model_state")}
          torch.save(inference, "build/ml-matched-checkpoint/development-inference.pt")
          PY

      - name: Fit diverse checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/train_mozart_model.py \
            build/ml-diverse-conditioning-fixture/train.jsonl \
            --validation-jsonl build/ml-diverse-conditioning-fixture/validation.jsonl \
            --output-dir build/ml-diverse-checkpoint \
            --epochs 12 \
            --batch-size 4 \
            --repeat-train-records 8 \
            --learning-rate 3e-4 \
            --fit-diagnostic \
            --seed ${{ matrix.seed }} \
            --device cpu
          python3 - <<'PY'
          import torch
          checkpoint = torch.load("build/ml-diverse-checkpoint/latest.pt", map_location="cpu", weights_only=False)
          if checkpoint.get("total_optimizer_updates") != 480:
              raise SystemExit("diverse fit must contain exactly 480 optimizer updates")
          inference = {key: checkpoint[key] for key in ("model_id", "config", "epoch", "seed", "train_loss", "validation_loss", "grammar_constrained_loss", "model_state")}
          torch.save(inference, "build/ml-diverse-checkpoint/development-inference.pt")
          PY

      - name: Export ONNX checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/export_mozart_onnx.py build/ml-matched-checkpoint/development-inference.pt build/ml-matched-checkpoint/model.onnx --config docs/model-training-config.json --sequence-length 16
          python3 tools/export_mozart_onnx.py build/ml-diverse-checkpoint/development-inference.pt build/ml-diverse-checkpoint/model.onnx --config docs/model-training-config.json --sequence-length 16

      - name: Evaluate five-point dose response
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_mozart_conditioning_dose_response.py \
            build/ml-matched-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-matched-checkpoint/model.onnx \
            --probe-file build/ml-matched-sequence-probes.json \
            --records-file build/ml-matched-train.jsonl \
            --levels 0.1,0.3,0.5,0.7,0.9 \
            --output build/ml-matched-dose-response.json
          python3 tools/evaluate_mozart_conditioning_dose_response.py \
            build/ml-diverse-checkpoint/development-inference.pt \
            --config docs/model-training-config.json \
            --onnx build/ml-diverse-checkpoint/model.onnx \
            --probe-file build/ml-diverse-conditioning-fixture/sequence-probes.json \
            --records-file build/ml-diverse-conditioning-fixture/train.jsonl \
            --levels 0.1,0.3,0.5,0.7,0.9 \
            --output build/ml-diverse-dose-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema_version": 2,
              "status": "PASS",
              "seed": int("${{ matrix.seed }}"),
              "levels": [0.1, 0.3, 0.5, 0.7, 0.9],
              "matched": json.loads(Path("build/ml-matched-dose-response.json").read_text(encoding="utf-8")),
              "diverse": json.loads(Path("build/ml-diverse-dose-response.json").read_text(encoding="utf-8")),
          }
          Path(f"build/dose-response-seed-${{ matrix.seed }}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload seed dose response
        uses: actions/upload-artifact@v7
        with:
          name: mozart-ml-conditioning-dose-response-seed-${{ matrix.seed }}
          path: |
            build/dose-response-seed-${{ matrix.seed }}.json
            build/ml-dose-response-input-contract.json
          archive: true
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: >-
      github.ref_name != 'main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[run-conditioning-dose-response]')
        )
      )
    needs: replicate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download seed dose response
        uses: actions/download-artifact@v7
        with:
          pattern: mozart-ml-conditioning-dose-response-seed-*
          merge-multiple: true
          path: build/seed-metrics

      - name: Aggregate dose response
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/summarize_mozart_conditioning_dose_response.py build/seed-metrics --output build/ml-conditioning-dose-response-summary.json

      - name: Upload dose response summary
        uses: actions/upload-artifact@v7
        with:
          name: mozart-ml-conditioning-dose-response-summary
          path: build/ml-conditioning-dose-response-summary.json
          archive: true
          if-no-files-found: error
          retention-days: 14
