name: Android Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "foundation/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Fetch pinned Ableton Link
        shell: bash
        run: bash tools/fetch_link.sh

      - name: Test Mozart C++ core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug -DMOZART_ENABLE_LINK=ON
          cmake --build build/native-tests --parallel 2
          build/native-tests/mozart_core_tests

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu off -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set -e
            adb start-server
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q "1"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.miguelduval.mozart.debug
            timeout 15s adb shell am start -n com.miguelduval.mozart.debug/com.miguelduval.mozart.MainActivity || true
            sleep 3
            adb shell pidof com.miguelduval.mozart.debug
            adb shell dumpsys activity activities > /tmp/mozart-activity.txt
            adb shell dumpsys window windows > /tmp/mozart-window.txt
            adb logcat -d -t 300 > /tmp/mozart-logcat.txt
            adb exec-out screencap -p > /tmp/mozart-screen.png
            timeout 10s adb shell uiautomator dump /sdcard/mozart-ui.xml || true
            if adb exec-out cat /sdcard/mozart-ui.xml > /tmp/mozart-ui.xml 2>/dev/null; then
              grep -Fq 'text="MOZART"' /tmp/mozart-ui.xml
              grep -Fq 'text="Manual key: F# minor"' /tmp/mozart-ui.xml
            else
              echo "UI hierarchy dump unavailable; activity/window/logcat diagnostics were captured."
            fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-emulator-diagnostics-${{ github.sha }}
          path: |
            /tmp/mozart-ui.xml
            /tmp/mozart-activity.txt
            /tmp/mozart-window.txt
            /tmp/mozart-logcat.txt
            /tmp/mozart-screen.png
          archive: true
          if-no-files-found: ignore
          retention-days: 14
