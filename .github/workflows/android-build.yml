name: Android Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "foundation/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Fetch pinned Ableton Link
        shell: bash
        run: bash tools/fetch_link.sh

      - name: Test Mozart C++ core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug -DMOZART_ENABLE_LINK=ON
          cmake --build build/native-tests --parallel 2
          build/native-tests/mozart_core_tests

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -gpu off -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set -e
            adb start-server
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q "1"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.miguelduval.mozart.debug
            rm -f /tmp/mozart-start.txt /tmp/mozart-start-status.txt /tmp/mozart-start-host-pid.txt
            '(adb shell am start -n com.miguelduval.mozart.debug/com.miguelduval.mozart.MainActivity > /tmp/mozart-start.txt 2>&1; printf "%s\n" "$?" > /tmp/mozart-start-status.txt) & printf "%s\n" "$!" > /tmp/mozart-start-host-pid.txt'
            sleep 5
            'if test -s /tmp/mozart-start-host-pid.txt; then kill "$(cat /tmp/mozart-start-host-pid.txt)" 2>/dev/null || true; fi'
            'if test -s /tmp/mozart-start-status.txt; then cat /tmp/mozart-start-status.txt; else printf "%s\n" "124" > /tmp/mozart-start-status.txt; fi'
            cat /tmp/mozart-start.txt || true
            sleep 2
            adb shell pidof com.miguelduval.mozart.debug > /tmp/mozart-pid.txt || true
            adb shell dumpsys activity activities > /tmp/mozart-activity.txt || true
            adb shell dumpsys window windows > /tmp/mozart-window.txt || true
            adb shell logcat -d -t 1000 > /tmp/mozart-logcat.txt || true
            adb exec-out screencap -p > /tmp/mozart-screen.png || true
            timeout 10s adb shell uiautomator dump /sdcard/mozart-ui.xml || true
            adb exec-out cat /sdcard/mozart-ui.xml > /tmp/mozart-ui.xml 2>/dev/null || true
            'printf "=== START STATUS ===\n"; cat /tmp/mozart-start-status.txt || true; printf "\n=== PID ===\n"; cat /tmp/mozart-pid.txt || true; printf "\n=== START OUTPUT ===\n"; cat /tmp/mozart-start.txt || true; printf "\n=== MOZART LOG MARKERS ===\n"; grep "MozartStartup" /tmp/mozart-logcat.txt || true'
            'if grep -Fq "FATAL EXCEPTION" /tmp/mozart-logcat.txt; then echo "Fatal Android exception detected."; exit 1; fi'
            'status="$(cat /tmp/mozart-start-status.txt 2>/dev/null || printf "%s" "124")"; if [ "$status" -ne 0 ]; then echo "am start did not return successfully (status=$status)."; exit 1; fi'
            'if ! test -s /tmp/mozart-pid.txt; then echo "Mozart process PID was not found."; exit 1; fi'
            'if ! grep -Fq "com.miguelduval.mozart.debug/com.miguelduval.mozart.MainActivity" /tmp/mozart-activity.txt; then echo "MainActivity was not present in activity manager state."; exit 1; fi'

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-emulator-diagnostics-${{ github.sha }}
          path: |
            /tmp/mozart-ui.xml
            /tmp/mozart-activity.txt
            /tmp/mozart-window.txt
            /tmp/mozart-logcat.txt
            /tmp/mozart-screen.png
            /tmp/mozart-start.txt
            /tmp/mozart-start-status.txt
            /tmp/mozart-start-host-pid.txt
            /tmp/mozart-pid.txt
          archive: true
          if-no-files-found: ignore
          retention-days: 14
