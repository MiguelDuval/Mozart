name: Android Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "foundation/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Test Mozart C++ core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel 2
          build/native-tests/mozart_core_tests

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Configure Android emulator acceleration
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          if [ -c /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM device is available; using hardware acceleration."
            echo "disable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This runner has no accessible /dev/kvm device; use the emulator's software acceleration fallback."
            echo "disable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu off -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-linux-hw-accel: ${{ steps.kvm.outputs.disable }}
          disable-animations: true
          script: |
            # android-emulator-runner executes this block with /bin/sh, not Bash.
            set -eu
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.miguelduval.mozart.debug
            adb shell am start -W -n com.miguelduval.mozart.debug/com.miguelduval.mozart.MainActivity
            adb shell uiautomator dump /sdcard/mozart-ui.xml
            adb exec-out cat /sdcard/mozart-ui.xml > /tmp/mozart-ui.xml
            grep -Fq 'text="MOZART"' /tmp/mozart-ui.xml
            # UIAutomator prefixes the status TextView with an XML newline entity.
            grep -Fq 'C++20 core ready | MIDI foundation | Link-ready timing boundary' /tmp/mozart-ui.xml

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-emulator-diagnostics-${{ github.sha }}
          path: |
            /tmp/mozart-ui.xml
          archive: true
          if-no-files-found: ignore
          retention-days: 14
