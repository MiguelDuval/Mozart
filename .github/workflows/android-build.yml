name: Android Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "foundation/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Fetch pinned Ableton Link
        shell: bash
        run: bash tools/fetch_link.sh

      - name: Validate model manifest templates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_model_manifest.py docs/model-manifest.example.json
          python3 tools/validate_model_manifest.py docs/experimental-onnx-manifest.example.json

      - name: Test model manifest validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_model_manifest.py'

      - name: Test Android JNI key context contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_jni_key_context_contract.py'

      - name: Test Android lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_lifecycle_contract.py'

      - name: Test pinned LiteRT SDK fetch
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/fetch_litert.sh
          bash tools/fetch_litert.sh
          test -f third_party/litert/litert_cc_sdk/CMakeLists.txt
          test "$(cat third_party/litert/VERSION)" = "2.2.0"
          test "$(cat third_party/litert/SHA256)" = "0aa619d80aef27303ad9c6e3759a20110f77e7b11ade9b68061b8c6e5904b0c6"

      - name: Validate dataset provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_dataset_manifest.py docs/dataset-manifest.example.json

      - name: Test dataset provenance manifest validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_dataset_manifest.py'

      - name: Validate dataset rights-audit ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_dataset_rights_audit.py docs/dataset-rights-audit-waivops-nrg-cp-v1.json
      - name: Validate dataset authority-chain audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_dataset_authority_chain.py docs/dataset-rights-authority-waivops-nrg-cp-v1.json

      - name: Test dataset authority-chain validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_dataset_authority_chain.py'

      - name: Test dataset rights-audit validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_dataset_rights_audit.py'
      - name: Test archive inventory builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_inventory_dataset_archive.py'

      - name: Test PDMX acquisition auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_audit_pdmx_source.py'

      - name: Test PDMX artifact checksum verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_pdmx_artifact.py'

      - name: Validate pinned PDMX acquisition manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_pdmx_acquisition_manifest.py docs/pdmx-acquisition-manifest-v9.json

      - name: Test PDMX acquisition manifest validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_validate_pdmx_acquisition_manifest.py'

      - name: Test PDMX acquisition workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_pdmx_acquisition_workflow.py'

      - name: Test PDMX conditioning distribution preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_audit_pdmx_conditioning_distribution.py'


      - name: Test manifest digest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_manifest_digest.py'

      - name: Test dataset manifest file verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_dataset_manifest_files.py'

      - name: Test manifest inventory matching
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_manifest_inventory.py'

      - name: Test deterministic MIDI discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_discover_midi_files.py'

      - name: Test deterministic long MIDI windowing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_training_windows.py'

      - name: Test Standard MIDI File validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_midi_smf.py'

      - name: Test MIDI normalization pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_midi_normalize.py'

      - name: Test Mozart Python token ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_tokenizer.py'

      - name: Test Mozart conditioning vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mozart_conditioning.py'

      - name: Test deterministic dataset split
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dataset_split.py'

      - name: Test end-to-end training example pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_midi_to_training_example.py'

      - name: Test training shard builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_training_shards.py'

      - name: Test dataset quality report
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dataset_quality.py'

      - name: Test dataset duplicate review gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dataset_quality_review.py'

      - name: Test deterministic synthetic fixture corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_fixture_corpus.py'

      - name: Test end-to-end corpus pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_corpus_pipeline.py'

      - name: Test compact model configuration
        run: python3 -m unittest discover -s tests -p 'test_mozart_model_config.py'
      - name: Compile model training scripts
        run: python3 -m py_compile tools/mozart_model.py tools/train_mozart_model.py
      - name: Test Mozart C++ core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug -DMOZART_ENABLE_LINK=ON
          cmake --build build/native-tests --parallel 2
          build/native-tests/mozart_core_tests
          build/native-tests/mozart_pattern_variation_tests
          build/native-tests/mozart_generation_provider_tests
          build/native-tests/mozart_model_catalog_tests
          build/native-tests/mozart_generation_service_tests
          build/native-tests/mozart_generation_request_ticket_tests
          build/native-tests/mozart_generation_request_json_tests
          build/native-tests/mozart_onnx_token_inference_backend_tests

      - name: Test Android JVM unit suite
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: ${{ always() && hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            stat -c 'kvm mode=%a group=%G' /dev/kvm
          else
            echo "/dev/kvm is unavailable; Android emulator will run without hardware acceleration." >&2
          fi

      - name: Run Android emulator smoke test (attempt 1)
        id: android-smoke-attempt-1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload first emulator diagnostics
        if: ${{ steps.android-smoke-attempt-1.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-emulator-attempt-1-diagnostics-${{ github.sha }}
          path: |
            /tmp/mozart-ui.xml
            /tmp/mozart-activity.txt
            /tmp/mozart-window.txt
            /tmp/mozart-logcat.txt
            /tmp/mozart-screen.png
            /tmp/mozart-start.txt
            /tmp/mozart-start-status.txt
            /tmp/mozart-start-host-pid.txt
            /tmp/mozart-pid.txt
            /tmp/mozart-ps.txt
            /tmp/mozart-processes.txt
            /tmp/mozart-attempt-1-logcat.txt
          archive: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Reset ADB and AVD state before retry
        if: ${{ steps.android-smoke-attempt-1.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          adb kill-server >/dev/null 2>&1 || true
          pkill -f 'emulator.*-avd' >/dev/null 2>&1 || true
          AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          rm -rf "$AVD_HOME"/* 2>/dev/null || true
          rm -f "$HOME/.android/avd"/*.ini 2>/dev/null || true

      - name: Run Android emulator smoke test (attempt 2)
        id: android-smoke-attempt-2
        if: ${{ steps.android-smoke-attempt-1.outcome != 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -wipe-data -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload second emulator diagnostics
        if: ${{ steps.android-smoke-attempt-2.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mozart-emulator-attempt-2-diagnostics-${{ github.sha }}
          path: |
            /tmp/mozart-ui.xml
            /tmp/mozart-activity.txt
            /tmp/mozart-window.txt
            /tmp/mozart-logcat.txt
            /tmp/mozart-screen.png
            /tmp/mozart-start.txt
            /tmp/mozart-start-status.txt
            /tmp/mozart-start-host-pid.txt
            /tmp/mozart-pid.txt
            /tmp/mozart-ps.txt
            /tmp/mozart-processes.txt
            /tmp/mozart-attempt-1-logcat.txt
          archive: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Final emulator smoke gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          first="${{ steps.android-smoke-attempt-1.outcome }}"
          second="${{ steps.android-smoke-attempt-2.outcome }}"
          echo "Android emulator attempt 1: $first"
          echo "Android emulator attempt 2: $second"
          if [[ "$first" == "success" || "$second" == "success" ]]; then
            echo "Android emulator smoke gate passed."
            exit 0
          fi
          echo "Android emulator smoke failed on both attempts." >&2
          exit 1
