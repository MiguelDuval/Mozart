name: Mozart ML Categorical Composition Determinism Probe

on:
  push:
    branches:
      - "feature/categorical-composition-determinism-diagnostic"
    paths:
      - ".github/workflows/ml-categorical-composition-determinism.yml"
      - "tools/train_mozart_model.py"
      - "tools/build_categorical_composition_fixture.py"
      - "tools/mozart_model.py"
      - "tools/mozart_conditioning.py"
      - "docs/model-training-config.json"
      - "tools/requirements-onnx-export.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Build sparse fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/determinism-fixture build/determinism-run-a build/determinism-run-b
          python3 tools/build_categorical_composition_fixture.py             build/determinism-fixture             --training-profile sparse-multi-axis

      - name: Train identical sparse fit twice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          fixture = ROOT / "build/determinism-fixture"
          common = [
              sys.executable,
              "tools/train_mozart_model.py",
              str(fixture / "train.jsonl"),
              "--validation-jsonl",
              str(fixture / "validation.jsonl"),
              "--output-dir",
              "",
              "--epochs",
              "12",
              "--batch-size",
              "4",
              "--repeat-train-records",
              "5",
              "--learning-rate",
              "3e-4",
              "--fit-diagnostic",
              "--seed",
              "42",
              "--device",
              "cpu",
          ]

          def canonical_model_digest(path: Path) -> str:
              checkpoint = __import__("torch").load(
                  path,
                  map_location="cpu",
                  weights_only=False,
              )
              state = checkpoint["model_state"]
              digest = hashlib.sha256()
              for name, tensor in sorted(state.items()):
                  tensor = tensor.detach().cpu().contiguous()
                  digest.update(name.encode("utf-8"))
                  digest.update(b"\0")
                  digest.update(str(tensor.dtype).encode("ascii"))
                  digest.update(b"\0")
                  digest.update(repr(tuple(tensor.shape)).encode("ascii"))
                  digest.update(b"\0")
                  digest.update(tensor.numpy().tobytes())
                  digest.update(b"\0")
              return digest.hexdigest()

          summary = {
              "torch_version": __import__("torch").__version__,
              "torch_num_threads": __import__("torch").get_num_threads(),
              "torch_num_interop_threads": __import__("torch").get_num_interop_threads(),
              "omp_num_threads": os.environ.get("OMP_NUM_THREADS"),
              "mkl_num_threads": os.environ.get("MKL_NUM_THREADS"),
              "runs": [],
          }

          for label in ("a", "b"):
              output = ROOT / f"build/determinism-run-{label}"
              log = ROOT / f"build/determinism-run-{label}.log"
              args = common.copy()
              args[args.index("")] = str(output)
              with log.open("w", encoding="utf-8") as handle:
                  subprocess.run(args, stdout=handle, stderr=subprocess.STDOUT, check=True)
              checkpoint = __import__("torch").load(
                  output / "best.pt",
                  map_location="cpu",
                  weights_only=False,
              )
              epoch_lines = [
                  line.strip()
                  for line in log.read_text(encoding="utf-8").splitlines()
                  if line.startswith("epoch=")
              ]
              summary["runs"].append({
                  "label": label,
                  "best_epoch": int(checkpoint["epoch"]),
                  "best_validation_loss": float(checkpoint["validation_loss"]),
                  "best_model_state_sha256": canonical_model_digest(output / "best.pt"),
                  "latest_model_state_sha256": canonical_model_digest(output / "latest.pt"),
                  "epoch_lines": epoch_lines,
              })

          equal = (
              summary["runs"][0]["best_model_state_sha256"]
              == summary["runs"][1]["best_model_state_sha256"]
              and summary["runs"][0]["latest_model_state_sha256"]
              == summary["runs"][1]["latest_model_state_sha256"]
              and summary["runs"][0]["epoch_lines"]
              == summary["runs"][1]["epoch_lines"]
          )
          summary["deterministic"] = equal
          print(json.dumps(summary, indent=2, sort_keys=True))
          Path("build/determinism-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish determinism evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-categorical-composition-determinism-probe
          path: |
            build/determinism-summary.json
            build/determinism-run-a.log
            build/determinism-run-b.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: false

      - name: Report diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/determinism-summary.json").read_text(encoding="utf-8"))
          if report["deterministic"]:
              print("DETERMINISM-PROBE: PASS — identical sparse fits produced identical training traces and model-state digests.")
          else:
              print("DETERMINISM-PROBE: NON-DETERMINISTIC — identical sparse fits diverged in training trace and/or model-state digest.")
          PY
