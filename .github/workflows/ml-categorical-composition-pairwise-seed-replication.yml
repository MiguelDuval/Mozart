name: Mozart ML Categorical Composition Pairwise Seed Replication

on:
  push:
    branches:
      - "feature/categorical-composition-pairwise-seed-replication"
    paths:
      - ".github/workflows/ml-categorical-composition-pairwise-seed-replication.yml"
      - "tools/build_categorical_composition_fixture.py"
      - "tests/test_build_categorical_composition_fixture.py"
      - "tools/evaluate_mozart_categorical_composition.py"
      - "tools/export_mozart_onnx.py"
      - "tools/train_mozart_model.py"
      - "tools/mozart_model.py"
      - "tools/mozart_conditioning.py"
      - "tools/mozart_token_grammar.py"
      - "docs/model-training-config.json"
      - "tools/requirements-onnx-export.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairwise-seed-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-onnx-export.txt

      - name: Install pinned ML export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-onnx-export.txt

      - name: Validate fixture and evaluator regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_build_categorical_composition_fixture.py'
          python3 -m unittest discover -s tests -p 'test_evaluate_mozart_categorical_composition.py'
          python3 -m py_compile \
            tools/build_categorical_composition_fixture.py \
            tools/evaluate_mozart_categorical_composition.py \
            tools/export_mozart_onnx.py \
            tools/train_mozart_model.py

      - name: Build clean unseen-3+ validation/test views
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/ml-categorical-composition-pairwise-seeds
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/{fixtures,views,reports,checkpoints}

          python3 tools/build_categorical_composition_fixture.py \
            "$ROOT/fixtures/baseline" \
            --training-profile single-axis-only

          python3 tools/build_categorical_composition_fixture.py \
            "$ROOT/fixtures/pairwise" \
            --training-profile pairwise-multi-axis-40

          python3 - "$ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def create_views(label):
              fixture = root / "fixtures" / label
              records = [
                  json.loads(line)
                  for line in (fixture / "records.jsonl").read_text(encoding="utf-8").splitlines()
                  if line
              ]

              names = {
                  record["composition_profile"]
                  for record in records
                  if record["split"] in {"validation", "test"}
                  and len(record["composition_axes"]) >= 3
              }
              test_names = set(names) | {f"{name}-base" for name in names}

              validation = [
                  record
                  for record in records
                  if record["split"] == "validation"
                  and record["composition_profile"] in names
              ]
              test = [
                  record
                  for record in records
                  if record["split"] == "test"
                  and record["composition_profile"] in test_names
              ]

              probes = json.loads(
                  (fixture / "composition-probes.json").read_text(encoding="utf-8")
              )
              probes["compositions"] = {
                  name: value
                  for name, value in probes["compositions"].items()
                  if len(value["axes"]) >= 3
              }

              out = root / "views" / label
              out.mkdir(parents=True, exist_ok=True)
              (out / "validation.jsonl").write_text(
                  "".join(json.dumps(r, sort_keys=True) + "\n" for r in validation),
                  encoding="utf-8",
              )
              (out / "test.jsonl").write_text(
                  "".join(json.dumps(r, sort_keys=True) + "\n" for r in test),
                  encoding="utf-8",
              )
              (out / "probes.json").write_text(
                  json.dumps(probes, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              if len(names) != 7 or len(validation) != 7 or len(test) != 14:
                  raise SystemExit(
                      f"{label}: expected 7 validation and 14 test records for unseen 3+"
                  )

          create_views("baseline")
          create_views("pairwise")
          print("PASS: clean unseen-3+ views created for baseline and pairwise")
          PY

      - name: Train baseline and pairwise seeds on one runner
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/ml-categorical-composition-pairwise-seeds

          run_fit() {
            local label="$1"
            local fixture="$2"
            local repeat="$3"
            local seed="$4"

            local checkpoint="$ROOT/checkpoints/$label"
            rm -rf "$checkpoint"
            mkdir -p "$checkpoint"

            python3 tools/train_mozart_model.py \
              "$ROOT/fixtures/$fixture/train.jsonl" \
              --validation-jsonl "$ROOT/views/$fixture/validation.jsonl" \
              --output-dir "$checkpoint" \
              --epochs 12 \
              --batch-size 4 \
              --repeat-train-records "$repeat" \
              --learning-rate 3e-4 \
              --fit-diagnostic \
              --seed "$seed" \
              --device cpu

            SEED="$seed" LABEL="$label" FIXTURE="$fixture" REPEAT="$repeat" CHECKPOINT="$checkpoint" python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import torch

          seed = int(os.environ["SEED"])
          label = os.environ["LABEL"]
          fixture = os.environ["FIXTURE"]
          repeat = int(os.environ["REPEAT"])
          root = Path(os.environ["CHECKPOINT"])

          latest = torch.load(root / "latest.pt", map_location="cpu", weights_only=False)
          best = torch.load(root / "best.pt", map_location="cpu", weights_only=False)

          assertions = {
              "total_optimizer_updates": latest.get("total_optimizer_updates") == 480,
              "epoch": latest.get("epoch") == 12,
              "fit_diagnostic": latest.get("fit_diagnostic") is True,
              "repeat_train_records": latest.get("repeat_train_records") == repeat,
              "seed": latest.get("seed") == seed,
          }
          for field in ("train_loss", "validation_loss"):
              assertions[field] = (
                  isinstance(latest.get(field), (int, float))
                  and math.isfinite(latest[field])
              )
          for name, ok in assertions.items():
              if not ok:
                  raise SystemExit(f"{label}: checkpoint assertion failed {name}")

          torch.save(
              {
                  "model_id": best["model_id"],
                  "config": best["config"],
                  "epoch": best["epoch"],
                  "seed": best["seed"],
                  "train_loss": best["train_loss"],
                  "validation_loss": best["validation_loss"],
                  "model_state": best["model_state"],
              },
              root / "development-inference.pt",
          )

          metadata = {
              "experiment": "categorical-composition-pairwise-seed-replication",
              "label": label,
              "fixture": fixture,
              "seed": seed,
              "epochs": 12,
              "batch_size": 4,
              "repeat_train_records": repeat,
              "optimizer_updates": 480,
              "validation_policy": "unseen-3-plus-only",
              "selected_epoch": int(best["epoch"]),
              "selected_validation_loss": float(best["validation_loss"]),
          }
          (root / "run-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"SELECTED {label}: seed={seed} "
              f"epoch={best['epoch']} validation_loss={best['validation_loss']:.6f}"
          )
          PY

            python3 tools/export_mozart_onnx.py \
              "$checkpoint/development-inference.pt" \
              "$checkpoint/model.onnx" \
              --config docs/model-training-config.json \
              --sequence-length 64 \
              --opset 18

            python3 tools/evaluate_mozart_categorical_composition.py \
              "$checkpoint/development-inference.pt" \
              "$ROOT/views/$fixture/test.jsonl" \
              "$ROOT/views/$fixture/probes.json" \
              --config docs/model-training-config.json \
              --onnx "$checkpoint/model.onnx" \
              --window-size 8 \
              --max-generated-tokens 32 \
              --output "$ROOT/reports/$label.json"

            python3 - "$checkpoint/run-metadata.json" "$ROOT/reports/$label.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          meta_path, report_path = map(Path, sys.argv[1:])
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["training_regime"] = meta["fixture"]
          report["experiment_label"] = meta["label"]
          report["seed"] = meta["seed"]
          report["selected_epoch"] = meta["selected_epoch"]
          report["selected_validation_loss"] = meta["selected_validation_loss"]
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if report.get("status") != "PASS":
              raise SystemExit(
                  f"{meta['label']}: evaluator returned {report.get('status')}"
              )
          print(
              f"EVALUATED {meta['label']}: "
              f"epoch={meta['selected_epoch']} "
              f"validation_loss={meta['selected_validation_loss']:.6f}"
          )
          PY

            rm -f \
              "$checkpoint/latest.pt" \
              "$checkpoint/best.pt" \
              "$checkpoint/development-inference.pt" \
              "$checkpoint/model.onnx"
          }

          run_fit baseline-20 baseline 8 42
          run_fit pairwise-40-seed42 pairwise 4 42
          run_fit pairwise-40-seed1337 pairwise 4 1337
          run_fit pairwise-40-seed2027 pairwise 4 2027

      - name: Analyze pairwise seed replication
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/ml-categorical-composition-pairwise-seeds

          python3 - "$ROOT" <<'PY'
          import json
          import statistics
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          labels = (
              "baseline-20",
              "pairwise-40-seed42",
              "pairwise-40-seed1337",
              "pairwise-40-seed2027",
          )

          reports = {
              label: json.loads((root / "reports" / f"{label}.json").read_text(encoding="utf-8"))
              for label in labels
          }
          metadata = {
              label: json.loads(
                  (root / "checkpoints" / label / "run-metadata.json").read_text(encoding="utf-8")
              )
              for label in labels
          }

          def extract(report):
              return {
                  profile: {
                      "axes": value["axes"],
                      "ar_mean_tv": value["autoregressive"]["mean_total_variation"],
                      "first_divergence": value["autoregressive"]["first_divergence_generated_index"],
                      "interaction_residual_ratio": value["logit_additivity_at_divergence"]["interaction_residual_ratio"],
                      "actual_vs_additive_cosine": value["logit_additivity_at_divergence"]["actual_vs_additive_cosine"],
                      "tf_mean_tv": value["teacher_forced"]["mean_base_vs_combo_total_variation"],
                      "tf_target_delta": value["teacher_forced"]["mean_target_probability_delta"],
                      "tf_parity": value["teacher_forced"]["parity_max_abs_error"],
                      "ar_parity": value["autoregressive"]["parity_max_abs_error"],
                  }
                  for profile, value in report["results"].items()
              }

          metrics = {label: extract(reports[label]) for label in labels}
          common_profiles = sorted(set(metrics["baseline-20"]) & set(metrics["pairwise-40-seed42"]))

          summary = {
              "experiment": "categorical-composition-pairwise-seed-replication",
              "validation_policy": "unseen-3-plus-only",
              "seeds": [42, 1337, 2027],
              "optimizer_updates_per_fit": 480,
              "common_profile_count": len(common_profiles),
              "common_profiles": common_profiles,
              "fits": {},
              "aggregate_pairwise": {},
          }

          for label in labels:
              meta = metadata[label]
              summary["fits"][label] = {
                  "fixture": meta["fixture"],
                  "seed": meta["seed"],
                  "selected_epoch": meta["selected_epoch"],
                  "selected_validation_loss": meta["selected_validation_loss"],
              }

          def aggregate(label, profiles):
              return {
                  "profile_count": len(profiles),
                  "ar_mean_tv": statistics.mean(metrics[label][p]["ar_mean_tv"] for p in profiles),
                  "first_divergence_mean": statistics.mean(metrics[label][p]["first_divergence"] for p in profiles),
                  "interaction_residual_ratio": statistics.mean(
                      metrics[label][p]["interaction_residual_ratio"] for p in profiles
                  ),
                  "actual_vs_additive_cosine": statistics.mean(
                      metrics[label][p]["actual_vs_additive_cosine"] for p in profiles
                  ),
                  "tf_mean_tv": statistics.mean(metrics[label][p]["tf_mean_tv"] for p in profiles),
                  "tf_target_delta": statistics.mean(
                      metrics[label][p]["tf_target_delta"] for p in profiles
                  ),
                  "max_tf_parity": max(metrics[label][p]["tf_parity"] for p in profiles),
                  "max_ar_parity": max(metrics[label][p]["ar_parity"] for p in profiles),
              }

          baseline_profiles = common_profiles
          baseline = aggregate("baseline-20", baseline_profiles)
          summary["aggregate_baseline"] = baseline

          pairwise_seed_aggregates = {}
          for label in labels[1:]:
              pairwise_seed_aggregates[label] = aggregate(label, common_profiles)

          for metric in (
              "ar_mean_tv",
              "interaction_residual_ratio",
              "actual_vs_additive_cosine",
              "tf_mean_tv",
              "tf_target_delta",
          ):
              values = [
                  pairwise_seed_aggregates[label][metric]
                  for label in labels[1:]
              ]
              summary["aggregate_pairwise"][metric] = {
                  "seed_42": values[0],
                  "seed_1337": values[1],
                  "seed_2027": values[2],
                  "mean": statistics.mean(values),
                  "stdev": statistics.stdev(values),
                  "min": min(values),
                  "max": max(values),
              }

          summary["aggregate_pairwise"]["vs_baseline_seed42"] = {
              label: {
                  "ar_mean_tv_delta_pct": (
                      (pairwise_seed_aggregates[label]["ar_mean_tv"] - baseline["ar_mean_tv"])
                      / abs(baseline["ar_mean_tv"]) * 100.0
                  ),
                  "interaction_residual_delta_pct": (
                      (pairwise_seed_aggregates[label]["interaction_residual_ratio"]
                       - baseline["interaction_residual_ratio"])
                      / abs(baseline["interaction_residual_ratio"]) * 100.0
                  ),
                  "actual_vs_additive_cosine_delta_pct": (
                      (pairwise_seed_aggregates[label]["actual_vs_additive_cosine"]
                       - baseline["actual_vs_additive_cosine"])
                      / abs(baseline["actual_vs_additive_cosine"]) * 100.0
                  ),
                  "tf_mean_tv_delta_pct": (
                      (pairwise_seed_aggregates[label]["tf_mean_tv"] - baseline["tf_mean_tv"])
                      / abs(baseline["tf_mean_tv"]) * 100.0
                  ),
              }
              for label in labels[1:]
          }

          for label in labels[1:]:
              comparable = common_profiles
              summary["fits"][label]["profile_deltas_vs_baseline"] = {
                  profile: {
                      "delta_ar_mean_tv": (
                          metrics[label][profile]["ar_mean_tv"]
                          - metrics["baseline-20"][profile]["ar_mean_tv"]
                      ),
                      "delta_interaction_residual": (
                          metrics[label][profile]["interaction_residual_ratio"]
                          - metrics["baseline-20"][profile]["interaction_residual_ratio"]
                      ),
                      "delta_additive_cosine": (
                          metrics[label][profile]["actual_vs_additive_cosine"]
                          - metrics["baseline-20"][profile]["actual_vs_additive_cosine"]
                      ),
                      "delta_tf_mean_tv": (
                          metrics[label][profile]["tf_mean_tv"]
                          - metrics["baseline-20"][profile]["tf_mean_tv"]
                      ),
                  }
                  for profile in comparable
              }

          (root / "pairwise-seed-replication-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "PAIRWISE-SEED-REPLICATION COMPLETE "
              f"common_profiles={len(common_profiles)}"
          )
          print(
              f"baseline-20 validation={baseline_profiles and metadata['baseline-20']['selected_validation_loss']:.6f}"
          )
          for label in labels[1:]:
              meta = metadata[label]
              agg = pairwise_seed_aggregates[label]
              print(
                  f"{label}: epoch={meta['selected_epoch']} "
                  f"validation={meta['selected_validation_loss']:.6f} "
                  f"AR={agg['ar_mean_tv']:.6f} "
                  f"interaction={agg['interaction_residual_ratio']:.6f} "
                  f"cosine={agg['actual_vs_additive_cosine']:.6f} "
                  f"TF={agg['tf_mean_tv']:.6f}"
              )
          PY

      - name: Publish pairwise seed replication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozart-categorical-composition-pairwise-seed-replication
          path: |
            build/ml-categorical-composition-pairwise-seeds/pairwise-seed-replication-summary.json
            build/ml-categorical-composition-pairwise-seeds/reports/*.json
            build/ml-categorical-composition-pairwise-seeds/checkpoints/*/run-metadata.json
            build/ml-categorical-composition-pairwise-seeds/fixtures/*/fixture-metadata.json
            build/ml-categorical-composition-pairwise-seeds/views/*/*.json
            build/ml-categorical-composition-pairwise-seeds/views/*/*.jsonl
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: false
