plugins {
    id "com.android.application"
}

android {
    namespace "com.miguelduval.mozart"
    compileSdk 36

    defaultConfig {
        applicationId "com.miguelduval.mozart"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0-foundation"

        ndkVersion "28.2.13676358"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DMOZART_ENABLE_LINK=ON"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }
}
